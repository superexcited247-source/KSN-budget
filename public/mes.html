 const machineRows=state.machines.filter(m=>m.active!==false).map(m=>{const checked=(seg.machineIds||[]).includes(m.id),h=Number(seg.machineHours?.[m.id])||0,other=otherMachineHours(m.id,date,p.id,s.stepId),cap=Number(m.dailyHours||state.settings.workHours);return `<div class="assign-row machine-row"><input type="checkbox" ${checked?'checked':''} onchange="ganttDraftToggleMachine('${date}','${m.id}',this.checked)"><label>${esc(m.name)} <small>${esc(m.type||'설비')} · 기준 ${num(cap,1)}h · 다른 작업 ${num(other,1)}h</small></label><input type="number" step="0.5" min="0" value="${checked?h:0}" ${checked?'':'disabled'} onchange="ganttDraftMachineHours('${date}','${m.id}',this.value)" title="설비 사용시간"></div>`}).join('');
 const dayHours=(seg.workerAlloc||[]).reduce((t,a)=>t+(Number(a.hours)||0),0),total=assignedPersonHours(s),req=requiredPersonHours(p,s,st),issues=collectDraftDayWarnings(p,s,st,date,seg);
 return `<div class="assign-grid"><div class="assign-list"><div class="assign-list-title">작업자 · ${fmtFull(date)}</div>${workerRows||'<div class="muted" style="padding:10px">등록된 작업자가 없습니다.</div>'}</div><div class="assign-list"><div class="assign-list-title">설비 · ${fmtFull(date)}</div>${machineRows||'<div class="muted" style="padding:10px">등록된 설비가 없습니다.</div>'}</div></div><div class="gantt-editor-summary"><div><span>선택일 배정</span><b>${num(dayHours,1)} 인시</b></div><div><span>공정 전체 배정</span><b>${num(total,1)} 인시</b></div><div><span>공정 필요</span><b>${num(req,1)} 인시</b></div><div><span>차이</span><b>${total>=req?'+':''}${num(total-req,1)} 인시</b></div></div>${issues.length?`<div class="override-warn"><b>⚠ 이 날짜 경고</b><br>${issues.map(esc).join('<br>')}<br><span>저장은 가능합니다. 관리자가 실제 현장 상황에 맞게 결정하세요.</span></div>`:''}`
}
function collectDraftDayWarnings(p,s,st,date,seg){const out=[];for(const a of seg.workerAlloc||[]){if(Number(a.hours)<=0)continue;const w=getWorker(a.id),cap=workerCapacity(w,date),other=otherWorkerHours(a.id,date,p.id,s.stepId),sum=other+Number(a.hours);if(cap<=0)out.push(`${w?.name||'작업자'}: 휴무/미출근 배정`);if(sum>cap+.01)out.push(`${w?.name||'작업자'}: ${num(sum,1)}h 배정 / 출근기준 ${num(cap,1)}h`)}for(const mid of seg.machineIds||[]){const m=getMachine(mid),cap=Number(m?.dailyHours||state.settings.workHours),other=otherMachineHours(mid,date,p.id,s.stepId),h=Number(seg.machineHours?.[mid])||0;if(other+h>cap+.01)out.push(`${m?.name||'설비'}: ${num(other+h,1)}h 사용 / 기준 ${num(cap,1)}h`)}if(st.machineType&&(seg.workerAlloc||[]).some(a=>Number(a.hours)>0)&&!(seg.machineIds||[]).length)out.push(`${st.machineType} 설비 미지정`);return out}
function ganttDraftToggleWorker(date,wid,on){const seg=ganttDraftSegment(date);if(on){if(!seg.workerAlloc.some(a=>a.id===wid)){const w=getWorker(wid),cap=workerCapacity(w,date),other=otherWorkerHours(wid,date,ganttEditorDraft.projectId,ganttEditorDraft.stepId);seg.workerAlloc.push({id:wid,hours:Math.max(.5,Math.min(Number(w?.dailyHours)||8,Math.max(.5,cap-other||Number(w?.dailyHours)||8)))})}}else seg.workerAlloc=seg.workerAlloc.filter(a=>a.id!==wid);refreshScheduleMeta(ganttEditorDraft.schedule);renderGanttStepEditor()}
function ganttDraftWorkerHours(date,wid,val){const seg=ganttDraftSegment(date),a=seg.workerAlloc.find(x=>x.id===wid);if(a)a.hours=Math.max(0,Number(val)||0);refreshScheduleMeta(ganttEditorDraft.schedule);renderGanttStepEditor()}
function ganttDraftToggleMachine(date,mid,on){const seg=ganttDraftSegment(date);if(on){if(!seg.machineIds.includes(mid))seg.machineIds.push(mid);if(!seg.machineHours[mid])seg.machineHours[mid]=Math.max(0,(seg.workerAlloc||[]).reduce((m,a)=>Math.max(m,Number(a.hours)||0),0))}else{seg.machineIds=seg.machineIds.filter(id=>id!==mid);delete seg.machineHours[mid]}refreshScheduleMeta(ganttEditorDraft.schedule);renderGanttStepEditor()}
function ganttDraftMachineHours(date,mid,val){const seg=ganttDraftSegment(date);if(seg.machineIds.includes(mid))seg.machineHours[mid]=Math.max(0,Number(val)||0);renderGanttStepEditor()}
function saveGanttStepEditor(){
 const d=ganttEditorDraft;if(!d)return;const p=state.projects.find(x=>x.id===d.projectId),s=p?.schedule?.find(x=>x.stepId===d.stepId),st=p?.processes?.find(x=>x.id===d.stepId);if(!p||!s||!st)return;const before=clone(s);const ns=clone(d.schedule),nst=clone(d.step);ensureScheduleRange(ns,ns.start,ns.end);refreshScheduleMeta(ns);
 if(nst.type==='internal'){const req=Math.max(0,Number(ns.personHours)||requiredPersonHours(p,ns,nst));ns.personHours=req;nst.setupMinutes=Math.max(0,Number(nst.setupMinutes)||0);if(Number(p.qty)>0)nst.hoursPer100=Math.max(.01,(Math.max(0,req-nst.setupMinutes/60)*100/Number(p.qty)));const totalAssigned=assignedPersonHours(ns);for(const seg of ns.segments){const h=(seg.workerAlloc||[]).reduce((t,a)=>t+(Number(a.hours)||0),0);seg.qty=req>0?(h/req)*(Number(p.qty)||0):0;for(const mid of seg.machineIds||[]){if(!(Number(seg.machineHours?.[mid])>0))seg.machineHours[mid]=(seg.workerAlloc||[]).reduce((m,a)=>Math.max(m,Number(a.hours)||0),0)} }if(totalAssigned<=0)ns.workerIds=[]}
 Object.assign(st,nst);Object.assign(s,ns);refreshScheduleMeta(s);state.lastIssues=collectScheduleWarnings();log('간트 공정 상세수정',`${p.client} · ${s.name} / ${fmtFull(before.start)}~${fmtFull(before.end)} → ${fmtFull(s.start)}~${fmtFull(s.end)} / 작업자 ${(s.workerIds||[]).length}명 / 설비 ${(s.machineIds||[]).length}대`);save();closeGanttStepEditor();render();toast('간트 공정을 저장했습니다.',state.lastIssues.length?`작업자·설비 한도 등 경고 ${state.lastIssues.length}건이 있습니다. 일정은 그대로 저장됐습니다.`:'작업자 할 일·설비·납기·손익에 모두 동기화되었습니다.')
}
function closeGanttStepEditor(){ganttEditorDraft=null;ganttEditorDate=null;closeModal()}

function planPage(){
 const days=ganttDays,min=ganttStartDate,max=addDays(min,days-1),warnings=collectScheduleWarnings(),warnKeys=new Set(warnings.filter(x=>x.stepId).map(x=>`${x.projectId}|${x.stepId}`));let header='';for(let i=0;i<days;i++){const d=addDays(min,i),dow=parseDate(d).getDay(),cls=[dow===0?'sun':'',dow===6?'sat':'',d===localDate()?'today':''].filter(Boolean).join(' ');header+=`<div class="${cls}"><b>${fmtDate(d)}</b><span>${['일','월','화','수','목','금','토'][dow]}</span></div>`}
 let body='';for(const p of state.projects.filter(x=>!['취소'].includes(x.status))){const r=projectRisk(p);for(const s of p.schedule||[]){if(!s.start||s.end<min||s.start>max)continue;const visStart=s.start<min?min:s.start,visEnd=s.end>max?max:s.end,off=clamp(dayDiff(min,visStart),0,days-1),span=clamp(dayDiff(visStart,visEnd)+1,1,days-off),people=ganttWorkers(s),machines=ganttMachineText(s),sel=selectedGantt?.projectId===p.id&&selectedGantt?.stepId===s.stepId,warn=warnKeys.has(`${p.id}|${s.stepId}`);body+=`<div class="timeline-row" style="--days:${days}"><div class="timeline-label"><strong>${esc(p.client)} · ${esc(p.product)}</strong><span class="proc">${esc(s.name)} ${s.locked?'🔒':''}</span><small>${esc(people)}${machines?` · ${esc(machines)}`:''}</small></div>${Array.from({length:days},(_,i)=>{const d=addDays(min,i),dow=parseDate(d).getDay(),cellCls=[dow===0?'sun':'',dow===6?'sat':'',d===localDate()?'today':''].filter(Boolean).join(' ');return i===off?`<div class="timeline-cell ${cellCls}"><div class="timeline-bar ${s.type==='external'?'external':''} ${r.level==='bad'?'late':''} ${s.locked?'locked':''} ${sel?'selected':''} ${warn?'conflict':''}" data-project="${p.id}" data-step="${s.stepId}" onpointerdown="startGanttDrag(event,'${p.id}','${s.stepId}')" onclick="selectGantt('${p.id}','${s.stepId}')" ondblclick="event.stopPropagation();openGanttStepEditor('${p.id}','${s.stepId}')" title="${esc(p.client)} · ${esc(s.name)} | ${esc(people)} | ${fmtFull(s.start)}~${fmtFull(s.end)}" style="width:calc(${span} * var(--gcell) - 5px)"><span class="gantt-resize-handle left" title="드래그해서 시작일 변경" onpointerdown="startGanttResize(event,'${p.id}','${s.stepId}','left')"></span><span class="bar-copy"><b><span data-lockmark>${s.locked?'🔒 ':''}</span>${esc(s.name)}</b><span>${esc(people)}</span></span><span class="gantt-resize-handle right" title="드래그해서 종료일 변경" onpointerdown="startGanttResize(event,'${p.id}','${s.stepId}','right')"></span></div></div>`:`<div class="timeline-cell ${cellCls}"></div>`}).join('')}</div>`}}
 const warningHtml=warnings.length?`<div class="gantt-warning"><b>⚠ 일정 경고 ${warnings.length}건</b><span>${warnings.slice(0,5).map(x=>esc(`${x.projectName}: ${x.message}`)).join('<br>')}${warnings.length>5?'<br>…':''}</span></div>`:'';
 return `<div class="page-head"><div><h1>생산계획</h1><div class="sub">간트가 실제 생산계획의 기준입니다. 공정 위치·기간·작업자·시간·설비를 여기서 바꾸면 다른 화면도 같은 데이터로 즉시 바뀝니다.</div></div><div class="head-actions"><button class="btn accent" onclick="scheduleAll(true)">자동 일정 재계산</button></div></div><div class="section"><div class="section-title"><div><h2>생산 간트</h2><span class="hint">가운데 드래그 = 이동 · 양끝 드래그 = 기간 조절 · 더블클릭/꾹 누르기 = 작업자·시간·설비 편집</span></div></div><div class="gantt-toolbar"><button class="btn small" onclick="ganttMove(-14)">← 2주</button><button class="btn small" onclick="ganttToday()">오늘</button><button class="btn small" onclick="ganttMove(14)">2주 →</button><div class="sep"></div><select class="btn small" onchange="setGanttDays(Number(this.value))"><option value="21" ${days===21?'selected':''}>3주 보기</option><option value="28" ${days===28?'selected':''}>4주 보기</option><option value="42" ${days===42?'selected':''}>6주 보기</option></select><div class="sep"></div><button id="ganttLockBtn" class="btn small primary" onclick="toggleSelectedLock()" ${selectedGantt?'':'disabled'}>${selectedSchedule().s?.locked?'🔓 선택 공정 잠금 해제':'🔒 선택 공정 잠금'}</button><button id="ganttEditBtn" class="btn small" onclick="openSelectedGanttEditor()" ${selectedGantt?'':'disabled'}>✏ 선택 공정 상세편집</button><span id="ganttSelectedLabel" class="gantt-selected-label">${selectedSchedule().s?`선택: ${esc(selectedSchedule().p.client)} · ${esc(selectedSchedule().s.name)}`:'간트의 공정을 선택하세요.'}</span></div><div id="ganttInspector" class="gantt-inspector">${ganttSelectedSummaryHtml()}</div><div class="gantt-help"><b>현장 편집 방식</b> · 공정 바 가운데를 끌면 전체 일정 이동 · 왼쪽/오른쪽 손잡이를 끌면 시작일/종료일 변경 · 공정을 더블클릭(폰은 약 0.65초 꾹 누르기)하면 해당 기간의 날짜별 출근인원, 작업시간, 설비를 직접 지정합니다. <b>관리자 수동배치는 근무시간을 초과해도 막지 않고 경고만 합니다.</b></div><div class="timeline-wrap"><div class="timeline-v4"><div class="timeline-head" style="--days:${days}"><div>프로젝트 / 공정 / 배정자</div>${header}</div>${body||'<div class="muted" style="padding:16px">현재 범위에 표시할 일정이 없습니다.</div>'}</div></div>${warningHtml}</div>`;
}

function closeModal(){$('modalRoot').innerHTML=''}
render();
hydrateMesServer();
</script>
