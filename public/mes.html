<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<title>허슬 MES · 생산관리</title>
<style>
:root{

  --red:#bd3a37;--red-soft:#fff0ef;--green:#2e7d4f;--green-soft:#edf7f1;--blue:#2f67b1;--blue-soft:#eef4fb;
  --radius:14px;--shadow:0 8px 26px rgba(16,33,42,.07)
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.mono{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}
.topbar{position:sticky;top:0;z-index:50;background:rgba(244,246,247,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1500px;margin:auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brandmark{width:40px;height:40px;border-radius:10px;background:var(--nav);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:950;letter-spacing:.5px}.brandtxt{font-weight:950;line-height:1.08}.brandtxt small{display:block;font-size:10px;color:var(--muted);font-weight:750;margin-top:4px;letter-spacing:.4px}.top-actions{display:flex;gap:7px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:#26343a;padding:9px 12px;border-radius:10px;font-weight:850;white-space:nowrap}.btn:hover{border-color:#bcc8cd}.btn.primary{background:var(--nav);border-color:var(--nav);color:#fff}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.warn{background:var(--yellow);border-color:var(--yellow);color:#fff}.btn.danger{color:var(--red)}.btn.small{padding:6px 8px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}
.shell{max-width:1500px;margin:auto;padding:16px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px}.sidebar{position:sticky;top:72px;height:calc(100vh - 88px);background:var(--nav);border-radius:16px;padding:10px;color:#fff;display:flex;flex-direction:column;overflow:auto}.nav-group{font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:#9bb0b9;padding:12px 10px 5px;font-weight:900}.nav-btn{border:0;background:transparent;color:#d8e3e7;padding:10px 11px;border-radius:10px;text-align:left;font-weight:800;width:100%;margin:1px 0}.nav-btn:hover{background:rgba(255,255,255,.06)}.nav-btn.active{background:#fff;color:var(--nav)}.side-note{margin-top:auto;border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:10px;font-size:10px;line-height:1.45;color:#bad0d8;background:rgba(255,255,255,.04)}
.content{min-width:0}.page-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:2px 0 13px}.page-head h1{font-size:28px;letter-spacing:-.8px;margin:0 0 4px}.page-head .sub{font-size:12px;color:var(--muted);line-height:1.5}.head-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.kpi .label{font-size:11px;color:var(--muted);font-weight:800}.kpi .value{font-size:25px;font-weight:950;margin-top:8px;letter-spacing:-.6px}.kpi .note{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.45}.kpi.alert{border-color:#f2c4c0;background:#fff9f8}.kpi.good{border-color:#cce7d6;background:#fbfffc}.kpi.money{border-color:#b7d8d4;background:#f8fffe}
.section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 2px 10px rgba(16,33,42,.025)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}.section-title h2{font-size:17px;margin:0;letter-spacing:-.3px}.hint{font-size:10px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;text-align:left;min-height:78px}.quick strong{display:block;font-size:14px;margin-bottom:4px}.quick span{font-size:10px;line-height:1.4;color:var(--muted)}.quick.accent{background:var(--accent-soft);border-color:#b9dfdb}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;border-bottom:1px solid #edf0f2;padding:9px 8px;font-size:11px;vertical-align:middle}th{position:sticky;top:0;background:#f9fafb;color:var(--muted);font-weight:900;z-index:1}.actions{display:flex;gap:5px;flex-wrap:wrap}.nowrap{white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:900;background:#f0f2f3;color:#4b5960}.pill.ok{background:var(--green-soft);color:var(--green)}.pill.warn{background:var(--yellow-soft);color:#8a620c}.pill.bad{background:var(--red-soft);color:var(--red)}.pill.blue{background:var(--blue-soft);color:var(--blue)}.pill.accent{background:var(--accent-soft);color:#006d67}.pill.lock{background:#f0effa;color:#5751a5}
.alert-box{border:1px solid var(--line);background:#fafbfb;border-radius:11px;padding:10px 12px;font-size:11px;line-height:1.55}.alert-box.bad{border-color:#f0c7c4;background:var(--red-soft);color:#8f2f2b}.alert-box.warn{border-color:#efd9a2;background:var(--yellow-soft);color:#765407}.alert-box.ok{border-color:#c9e6d4;background:var(--green-soft);color:#276945}.alert-box+.alert-box{margin-top:7px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #e8edef;font-size:11px}.row:last-child{border-bottom:0}.row>span:first-child{color:var(--muted)}
.progress{height:7px;border-radius:999px;background:#edf1f2;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px}.utilbar{display:grid;grid-template-columns:85px 1fr 42px;gap:8px;align-items:center;font-size:10px;margin:7px 0}.utilbar .bar{height:8px;background:#edf1f2;border-radius:999px;overflow:hidden}.utilbar .bar i{display:block;height:100%;background:var(--accent)}.utilbar.over .bar i{background:var(--red)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:10px;color:#536067;font-weight:900;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d8e0e3;border-radius:9px;background:#fff;padding:10px 10px;color:#162126;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7fc1bc;box-shadow:0 0 0 3px rgba(0,127,120,.08)}.field textarea{min-height:75px;resize:vertical}.span2{grid-column:1/-1}.help{font-size:9px;color:var(--muted);line-height:1.45;margin-top:4px}.form-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:12px;flex-wrap:wrap}
.modal-back{position:fixed;inset:0;z-index:150;background:rgba(12,26,33,.46);display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:17px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal.wide{width:min(1050px,100%)}.modal h2{margin:0}
.toast-root{position:fixed;top:70px;right:14px;z-index:300;width:min(330px,calc(100vw - 28px));display:flex;flex-direction:column;gap:7px}.toast{background:#fff;border:1px solid #c8e4d3;border-left:5px solid var(--green);border-radius:11px;padding:10px 12px;box-shadow:0 14px 36px rgba(0,0,0,.16);opacity:0;transform:translateY(-6px);transition:.18s}.toast.show{opacity:1;transform:none}.toast.error{border-color:#efc5c3;border-left-color:var(--red)}.toast strong{display:block;font-size:12px}.toast small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.process-list{display:flex;flex-direction:column;gap:7px}.process-card{display:grid;grid-template-columns:31px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px}.process-no{width:29px;height:29px;border-radius:8px;background:var(--accent-soft);color:#006b65;display:grid;place-items:center;font-size:11px;font-weight:950}.process-card strong{font-size:12px;display:block}.process-card small{font-size:9px;color:var(--muted);display:block;margin-top:3px;line-height:1.45}
.worker-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.worker-day{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.worker-day h3{font-size:13px;margin:0 0 8px}.task{border-left:4px solid var(--accent);background:#f7fbfb;border-radius:8px;padding:8px;margin:6px 0}.task.external{border-left-color:var(--yellow);background:#fffaf0}.task strong{display:block;font-size:10px}.task small{display:block;font-size:9px;color:var(--muted);margin-top:3px;line-height:1.4}.task-line{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:5px;font-size:9px}
.timeline-wrap{overflow:auto}.timeline{min-width:940px}.timeline-head,.timeline-row{display:grid;grid-template-columns:220px repeat(var(--days),34px)}.timeline-head>div{font-size:9px;text-align:center;color:var(--muted);padding:5px 1px;border-bottom:1px solid var(--line)}.timeline-head>div:first-child{text-align:left;font-weight:900}.timeline-row{min-height:47px;border-bottom:1px solid #edf0f2;align-items:center}.timeline-label{padding:6px 8px 6px 0}.timeline-label strong{font-size:10px;display:block}.timeline-label small{font-size:8px;color:var(--muted);display:block;margin-top:2px}.timeline-cell{height:34px;border-left:1px solid #f0f2f3;position:relative}.timeline-bar{height:22px;position:relative;z-index:2;border-radius:7px;background:var(--accent);color:#fff;font-size:8px;font-weight:900;padding:0 5px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}.timeline-bar.external{background:var(--yellow)}.timeline-bar.late{background:var(--red)}.timeline-bar.locked{outline:2px solid #5c57a8;outline-offset:1px}
.project-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}.project-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.project-top h3{font-size:14px;margin:0}.project-top small{font-size:9px;color:var(--muted);display:block;margin-top:3px}.profit-positive{color:var(--green)}.profit-negative{color:var(--red)}.money-line{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.money-mini{border:1px solid #e6ebed;border-radius:9px;padding:8px}.money-mini span{font-size:8px;color:var(--muted);display:block}.money-mini b{font-size:11px;display:block;margin-top:4px}.decision-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}.decision-result{border:1px solid var(--line);border-radius:13px;padding:14px;min-height:300px}.decision-grade{font-size:28px;font-weight:950;margin:8px 0}.decision-grade.good{color:var(--green)}.decision-grade.warn{color:#9b6c0b}.decision-grade.bad{color:var(--red)}
.log-item{display:grid;grid-template-columns:145px 95px minmax(0,1fr);gap:10px;border-bottom:1px solid #edf0f2;padding:9px 0;font-size:10px}.log-item:last-child{border-bottom:0}.log-time{color:var(--muted)}.log-action{font-weight:900}.log-detail{line-height:1.45}
.month-switch{display:flex;gap:6px;align-items:center}.month-switch input{border:1px solid var(--line);border-radius:9px;padding:8px}
.mobile-nav{display:none}
@media(max-width:1120px){.shell{grid-template-columns:1fr;padding:12px 12px 78px}.sidebar{display:none}.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid3,.worker-board{grid-template-columns:repeat(2,1fr)}.decision-layout{grid-template-columns:1fr}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:80;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:5px 5px calc(5px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;border-radius:8px;padding:7px 2px;font-size:9px;font-weight:850;color:#526168}.mobile-nav button.active{background:var(--accent-soft);color:#006f69}}
@media(max-width:680px){.topbar-inner{padding:8px 9px}.brandmark{width:34px;height:34px}.brandtxt{font-size:12px}.brandtxt small{font-size:8px}.top-actions .btn{padding:7px 8px;font-size:10px}.shell{padding:9px 9px 76px}.page-head{align-items:flex-start;flex-direction:column}.page-head h1{font-size:23px}.head-actions{width:100%;justify-content:flex-start}.kpi-grid{grid-template-columns:1fr 1fr;gap:7px}.kpi{padding:11px}.kpi .value{font-size:20px}.grid2,.grid3,.grid4,.quick-grid,.worker-board{grid-template-columns:1fr}.section{padding:12px;margin-top:9px}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.money-line{grid-template-columns:1fr 1fr}.modal-back{padding:8px}.modal{padding:13px;border-radius:13px}.log-item{grid-template-columns:1fr;gap:2px}.timeline{min-width:820px}input,select,textarea{font-size:16px}.btn{font-size:11px}}

.subtabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;margin-bottom:4px;scrollbar-width:thin}
.subtab{border:1px solid var(--line);background:#fff;color:#44545b;border-radius:999px;padding:8px 13px;font-size:11px;font-weight:900;white-space:nowrap}
.subtab.active{background:var(--nav);border-color:var(--nav);color:#fff}
.weekday-checks{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0}.weekday-checks label{font-size:11px;font-weight:800;background:#f7f9fa;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.attendance-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.attendance-toolbar select,.attendance-toolbar input{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff;font-weight:800}
.att-week,.attendance-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.att-week{margin-bottom:5px}.att-week span{text-align:center;font-size:9px;font-weight:900;color:var(--muted)}
.att-day{min-height:68px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px;text-align:left;display:flex;flex-direction:column;gap:3px;color:#34444b}.att-day b{font-size:12px}.att-day span{font-size:9px;font-weight:900}.att-day small{font-size:8px;color:var(--muted)}.att-day.blank{visibility:hidden}.att-day.off{background:#f7f8f9;color:#9aa6aa}.att-day.half{background:#fff8e5}.att-day.overtime{background:#fff0dc}.att-day.selected{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
.attendance-actions{flex-wrap:wrap}
@media(max-width:640px){.att-day{min-height:58px;padding:5px}.att-day span{font-size:8px}.att-day small{font-size:7px}.subtab{padding:7px 10px}}

/* v4 production gantt */
:root{--gcell:48px}
.gantt-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 0 12px}
.gantt-toolbar .sep{width:1px;height:27px;background:var(--line);margin:0 2px}.gantt-selected-label{font-size:10px;color:var(--muted);font-weight:850;min-width:160px;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-help{border:1px solid #cfe2e0;background:#f7fffe;border-radius:11px;padding:9px 11px;font-size:10px;line-height:1.5;color:#3f5e5b;margin-bottom:10px}
.timeline-v4{min-width:max-content;position:relative}.timeline-v4 .timeline-head,.timeline-v4 .timeline-row{display:grid;grid-template-columns:250px repeat(var(--days),var(--gcell))}
.timeline-v4 .timeline-head{position:sticky;top:0;z-index:8;background:#fff}.timeline-v4 .timeline-head>div{height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:var(--muted);border-bottom:1px solid var(--line);border-left:1px solid #f0f2f3}.timeline-v4 .timeline-head>div:first-child{position:sticky;left:0;z-index:10;align-items:flex-start;background:#fff;border-left:0;padding-left:8px;font-weight:950}
.timeline-v4 .timeline-head .sun,.timeline-v4 .timeline-cell.sun{background:#fff6f5}.timeline-v4 .timeline-head .sat,.timeline-v4 .timeline-cell.sat{background:#f5f8fb}.timeline-v4 .timeline-head .today{background:var(--accent-soft);color:#006b65;font-weight:950}
.timeline-v4 .timeline-row{min-height:58px;border-bottom:1px solid #edf0f2;align-items:center;position:relative}.timeline-v4 .timeline-row:hover{background:#fcfdfd}.timeline-v4 .timeline-label{position:sticky;left:0;z-index:5;background:#fff;padding:7px 10px 7px 4px;min-height:57px;border-right:1px solid var(--line)}.timeline-v4 .timeline-row:hover .timeline-label{background:#fcfdfd}.timeline-v4 .timeline-label strong{font-size:10px;display:block;line-height:1.35}.timeline-v4 .timeline-label .proc{font-size:11px;font-weight:950;color:#213038}.timeline-v4 .timeline-label small{font-size:8px;color:var(--muted);display:block;margin-top:2px;line-height:1.35}.timeline-v4 .timeline-cell{height:57px;border-left:1px solid #f0f2f3;position:relative;display:flex;align-items:center}.timeline-v4 .timeline-cell.today{background:rgba(0,127,120,.055)}
.timeline-v4 .timeline-bar{height:38px;position:relative;z-index:3;border-radius:9px;background:var(--accent);color:#fff;padding:4px 9px;display:flex;flex-direction:column;justify-content:center;white-space:nowrap;overflow:hidden;box-shadow:0 4px 12px rgba(16,33,42,.12);user-select:none;touch-action:none;cursor:grab;transition:box-shadow .12s,outline .12s,opacity .12s}.timeline-v4 .timeline-bar.external{background:var(--yellow)}.timeline-v4 .timeline-bar.late{background:var(--red)}.timeline-v4 .timeline-bar.locked{cursor:pointer;background:#5d598f}.timeline-v4 .timeline-bar.selected{outline:3px solid #172127;outline-offset:2px;box-shadow:0 5px 17px rgba(16,33,42,.22)}.timeline-v4 .timeline-bar.dragging{opacity:.78;cursor:grabbing;transition:none;box-shadow:0 10px 25px rgba(16,33,42,.28)}.timeline-v4 .timeline-bar.conflict{box-shadow:0 0 0 3px #ffd16d inset,0 4px 12px rgba(16,33,42,.12)}.timeline-v4 .timeline-bar b{font-size:9px;overflow:hidden;text-overflow:ellipsis}.timeline-v4 .timeline-bar span{font-size:7px;opacity:.9;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.gantt-dragging{cursor:grabbing!important}.gantt-dragging *{cursor:grabbing!important}
.gantt-warning{display:flex;gap:8px;align-items:flex-start;border:1px solid #efd9a2;background:var(--yellow-soft);color:#765407;border-radius:10px;padding:9px 11px;font-size:10px;line-height:1.45;margin-top:8px}.gantt-warning b{white-space:nowrap}
.overlap-tag{display:inline-flex;border-radius:999px;background:#eef4fb;color:#2f67b1;padding:3px 6px;font-size:8px;font-weight:900;margin-left:4px}
@media(max-width:680px){:root{--gcell:44px}.timeline-v4 .timeline-head,.timeline-v4 .timeline-row{grid-template-columns:210px repeat(var(--days),var(--gcell))}.timeline-v4 .timeline-label{padding-left:2px}.gantt-toolbar{gap:5px}.gantt-selected-label{width:100%;max-width:none;order:9}.gantt-help{font-size:9px}.timeline-v4 .timeline-bar{height:36px;padding:4px 7px}}


/* v5 gantt-first editor */
.timeline-v4 .timeline-bar{overflow:visible;padding-left:12px;padding-right:12px}
.timeline-v4 .timeline-bar .bar-copy{overflow:hidden;display:flex;flex-direction:column;min-width:0;width:100%}
.timeline-v4 .timeline-bar .bar-copy b,.timeline-v4 .timeline-bar .bar-copy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt-resize-handle{position:absolute;top:0;bottom:0;width:10px;z-index:7;cursor:ew-resize;touch-action:none}
.gantt-resize-handle.left{left:0;border-radius:9px 0 0 9px}.gantt-resize-handle.right{right:0;border-radius:0 9px 9px 0}
.gantt-resize-handle:after{content:"";position:absolute;top:11px;bottom:11px;width:2px;background:rgba(255,255,255,.65);border-radius:9px}
.gantt-resize-handle.left:after{left:3px}.gantt-resize-handle.right:after{right:3px}
.timeline-v4 .timeline-bar:hover .gantt-resize-handle{background:rgba(255,255,255,.10)}
.timeline-v4 .timeline-bar.resizing{opacity:.82;transition:none;box-shadow:0 10px 25px rgba(16,33,42,.28)}
.gantt-inspector{display:grid;grid-template-columns:minmax(180px,1.2fr) repeat(4,minmax(115px,.7fr));gap:7px;border:1px solid var(--line);border-radius:11px;padding:8px;background:#fafcfc;margin-bottom:10px}
.gantt-inspector .gi-main{padding:4px 6px}.gantt-inspector .gi-main strong{display:block;font-size:11px}.gantt-inspector .gi-main small{display:block;font-size:9px;color:var(--muted);margin-top:3px;line-height:1.4}

<body>
<div class="topbar"><div class="topbar-inner">
  <div class="brand"><div class="brandmark">HS</div><div class="brandtxt">허슬 스튜디오 생산관리<small>PRODUCTION CONTROL · v15 MES</small></div></div>
  <div class="top-actions"><span id="serverSyncBadge" class="pill accent">서버 연결</span><button class="btn" onclick="setPage('의사결정')">수주 판단</button><button class="btn primary" onclick="openProjectModal()">+ 주문 등록</button><button class="btn" onclick="exitMes()">나가기</button></div>
</div></div>
<div class="shell"><aside id="sidebar" class="sidebar"></aside><main id="content" class="content"></main></div>
<div id="mobileNav" class="mobile-nav"></div><div id="modalRoot"></div><div id="toastRoot" class="toast-root"></div>
<script>
const KEY='hustle_production_v5_live';
const OLD_KEY='hustle_production_v4_live';
const PAGES=[
 {g:'운영',items:['홈','프로젝트','생산']},
 {g:'경영',items:['손익']},
 {g:'관리',items:['관리']}
];
let currentPage='홈', productionTab='plan', manageTab='workers', selectedWorkDate=normalizeWorkday(localDate()),
    attendanceMonth=localDate().slice(0,7), attendanceWorkerId=null, attendanceSelected=[],
    editingProjectId=null, editingTemplateId=null, draftSteps=[];
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function uid(p='id'){return p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function localDate(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0)}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return localDate(d)}
function dayDiff(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000)}
function fmtDate(s){if(!s)return '-';const d=parseDate(s);return `${d.getMonth()+1}/${d.getDate()}`}
function fmtFull(s){if(!s)return '-';const d=parseDate(s);return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`}
function money(n){return (Number(n)||0).toLocaleString('ko-KR')+'원'}
function num(n,d=0){return (Number(n)||0).toLocaleString('ko-KR',{maximumFractionDigits:d})}
function pct(n){return `${(Number(n)||0).toFixed(1)}%`}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function workday(s){return true}
function normalizeWorkday(s){let x=s;while(!workday(x))x=addDays(x,1);return x}
function nextWorkday(s){return normalizeWorkday(addDays(s,1))}
function workdaysBetween(start,end){let out=[],d=normalizeWorkday(start),guard=0;while(d<=end&&guard++<370){out.push(d);d=nextWorkday(d)}return out}
function toast(title,detail='',error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.innerHTML=`<strong>${esc(title)}</strong>${detail?`<small>${esc(detail)}</small>`:''}`;$('toastRoot').appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),220)},2400)}
function log(action,detail){state.logs.unshift({id:uid('log'),at:new Date().toISOString(),action,detail,user:'관리자'});state.logs=state.logs.slice(0,300)}
let mesServerVersion=0,mesHydrated=false,mesSaveTimer=null,mesSaving=false,mesPendingSave=false,mesLastPull=0;
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function setSyncBadge(text,kind='accent'){const el=$('serverSyncBadge');if(!el)return;el.textContent=text;el.className='pill '+kind}
function save(){localSave();if(mesHydrated)queueMesSave()}
function queueMesSave(){clearTimeout(mesSaveTimer);mesSaveTimer=setTimeout(pushMesState,220)}
async function pushMesState(){
 if(!mesHydrated)return;if(mesSaving){mesPendingSave=true;return}mesSaving=true;setSyncBadge('저장 중','warn');
 try{
  const r=await fetch('/api/mes/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:mesServerVersion,state})});
  if(r.status===401){location.href='/mes';return}
  if(r.status===409){const latest=await r.json();mesServerVersion=Number(latest.version)||0;if(latest.state){state=normalizeV3(latest.state);localSave();render();toast('다른 기기의 변경사항을 불러왔습니다.','동시에 수정된 내용이 있어 서버 최신 상태로 맞췄습니다.',true)}setSyncBadge('동기화됨','accent');return}
  if(!r.ok)throw new Error('save '+r.status);const data=await r.json();mesServerVersion=Number(data.version)||mesServerVersion+1;setSyncBadge('저장됨','ok')
 }catch(e){setSyncBadge('저장 대기','warn');console.error(e)}finally{mesSaving=false;if(mesPendingSave){mesPendingSave=false;queueMesSave()}}
}
async function hydrateMesServer(){
 try{
  setSyncBadge('불러오는 중','warn');const r=await fetch('/api/mes/state',{cache:'no-store'});if(r.status===401){location.href='/mes';return}if(!r.ok)throw new Error('load '+r.status);const data=await r.json();mesServerVersion=Number(data.version)||0;
  if(data.state){state=normalizeV3(data.state);localSave();mesHydrated=true;render();setSyncBadge('동기화됨','accent')}
  else{mesHydrated=true;setSyncBadge('첫 저장','warn');await pushMesState()}
 }catch(e){mesHydrated=false;setSyncBadge('오프라인','warn');toast('MES 서버 동기화에 실패했습니다.','이 기기에 임시 저장되며 서버 연결이 복구되면 다시 시도해주세요.',true);console.error(e)}
}
async function pullMesState(){
 if(!mesHydrated||mesSaving||document.visibilityState==='hidden')return;try{const r=await fetch('/api/mes/state',{cache:'no-store'});if(r.status===401){location.href='/mes';return}if(!r.ok)return;const data=await r.json();const v=Number(data.version)||0;if(v>mesServerVersion&&data.state){mesServerVersion=v;state=normalizeV3(data.state);localSave();render();setSyncBadge('업데이트됨','accent')}}catch(e){}
}
async function exitMes(){try{await fetch('/api/mes/logout',{method:'POST'});const r=await fetch('/api/session',{cache:'no-store'});const x=await r.json();location.href=x.authenticated?'/':'/mes'}catch(e){location.href='/mes'}}
setInterval(pullMesState,5000);
function normalizeV3(x){
 if(!x||typeof x!=='object')return seed();
 x.version=3;x.settings=x.settings||{workHours:8,bufferDays:1,minMargin:22,monthlyFixedCost:4800000};
 x.workers=x.workers||[];x.machines=x.machines||[];x.vendors=x.vendors||[];x.templates=x.templates||[];x.projects=x.projects||[];x.logs=x.logs||[];
 for(const w of x.workers){
   if(!Array.isArray(w.workDays))w.workDays=[1,2,3,4,5,6];
   if(!w.attendance||typeof w.attendance!=='object')w.attendance={};
   if(w.overtimeAllowed===undefined)w.overtimeAllowed=true;
   if(!w.maxDailyHours)w.maxDailyHours=Math.max(Number(w.dailyHours)||8,10);
 }
 return x;
}
function load(){
 try{
   const cur=JSON.parse(localStorage.getItem(KEY));
   if(cur)return normalizeV3(cur);
   const old=JSON.parse(localStorage.getItem(OLD_KEY));
   if(old)return normalizeV3(old);
   return seed();
 }catch(e){return seed()}
}
function seed(){
 const t=localDate(); const s=normalizeWorkday(t);
 const teeSteps=[
  stepInternal('재단','재단',5,10,1,2,true,'재단기','shared',8000),
  stepExternal('프린팅 외주',2,'나염 파트너 A',220000),
  stepInternal('봉제','봉제',18,20,1,4,true,'본봉기','perWorker',12000),
  stepInternal('마감·검수','검수',6,10,1,2,true,'','shared',5000),
  stepInternal('포장','포장',3,10,1,3,true,'','shared',3000)
 ];
 const hoodieSteps=[
  stepInternal('재단','재단',7,15,1,2,true,'재단기','shared',10000),
  stepExternal('자수 외주',3,'자수 파트너 B',350000),
  stepInternal('몸판 봉제','봉제',24,25,2,4,true,'본봉기','perWorker',15000),
  stepInternal('오버록','오버록',10,20,1,2,true,'오버록','perWorker',9000),
  stepInternal('마감·검수','검수',8,10,1,2,true,'','shared',6000),
  stepInternal('포장','포장',4,10,1,3,true,'','shared',3000)
 ];
 // 다음 공정은 앞 공정이 전부 끝날 때까지 무조건 기다리지 않습니다.
 // startAfterPct = 바로 앞 공정이 이 비율만큼 진행되면 시작 가능한 기준입니다.
 [teeSteps,hoodieSteps].forEach(steps=>steps.forEach((st,i)=>st.startAfterPct=i===0?0:([40,45,55,70,75][i-1]||60)));
 return {version:3,settings:{workHours:8,bufferDays:1,minMargin:22,monthlyFixedCost:4800000},
  workers:[
   {id:'w1',name:'김민수',skills:['재단','봉제'],dailyHours:8,maxDailyHours:10,overtimeAllowed:true,workDays:[1,2,3,4,5,6],attendance:{},hourlyCost:18500,active:true},
   {id:'w2',name:'박수진',skills:['봉제','본봉'],dailyHours:8,maxDailyHours:10,overtimeAllowed:true,workDays:[1,2,3,4,5],attendance:{},hourlyCost:17800,active:true},
   {id:'w3',name:'최유진',skills:['봉제','오버록'],dailyHours:8,maxDailyHours:10,overtimeAllowed:true,workDays:[1,2,3,4,5,6],attendance:{},hourlyCost:18200,active:true},
   {id:'w4',name:'이도현',skills:['검수','포장'],dailyHours:8,maxDailyHours:9,overtimeAllowed:true,workDays:[1,2,3,4,5],attendance:{},hourlyCost:16500,active:true},
   {id:'w5',name:'정하나',skills:['재단','포장','검수'],dailyHours:7,maxDailyHours:8,overtimeAllowed:false,workDays:[2,3,4,5,6],attendance:{},hourlyCost:17000,active:true}
  ],machines:[
   {id:'m1',name:'재단기 1',type:'재단기',dailyHours:8,active:true},
   {id:'m2',name:'본봉기 1',type:'본봉기',dailyHours:8,active:true},{id:'m3',name:'본봉기 2',type:'본봉기',dailyHours:8,active:true},{id:'m4',name:'본봉기 3',type:'본봉기',dailyHours:8,active:true},{id:'m5',name:'본봉기 4',type:'본봉기',dailyHours:8,active:true},
   {id:'m6',name:'오버록 1',type:'오버록',dailyHours:8,active:true},{id:'m7',name:'오버록 2',type:'오버록',dailyHours:8,active:true},{id:'m8',name:'삼봉기 1',type:'삼봉기',dailyHours:8,active:true}
  ],vendors:[{id:'v1',name:'나염 파트너 A',category:'나염/프린팅',leadDays:2,active:true},{id:'v2',name:'자수 파트너 B',category:'자수',leadDays:3,active:true}],
  templates:[{id:'tpl1',name:'티셔츠 기본',description:'재단 → 프린팅 → 봉제 → 검수 → 포장',steps:teeSteps},{id:'tpl2',name:'후드 기본',description:'재단 → 자수 → 몸판봉제 → 오버록 → 검수 → 포장',steps:hoodieSteps}],
  projects:[
   {id:'p1',client:'오브젝트웨어',product:'로고 티셔츠',qty:500,startDate:s,dueDate:addDays(s,13),priority:'높음',status:'생산중',revenue:8500000,materialCost:3000000,otherCost:250000,memo:'1차 납품',processes:clone(teeSteps),schedule:[]},
   {id:'p2',client:'스튜디오 레이어',product:'후드 스웨트',qty:260,startDate:addDays(s,1),dueDate:addDays(s,20),priority:'보통',status:'확정',revenue:10400000,materialCost:3900000,otherCost:340000,memo:'자수 위치 확인',processes:clone(hoodieSteps),schedule:[]},
   {id:'p3',client:'MFG LAB',product:'행사 티셔츠',qty:350,startDate:addDays(s,4),dueDate:addDays(s,17),priority:'보통',status:'확정',revenue:5600000,materialCost:1850000,otherCost:180000,memo:'포장 개별',processes:clone(teeSteps),schedule:[]}
  ],logs:[],scheduleGeneratedAt:null};
}
function clone(x){return JSON.parse(JSON.stringify(x))}
function stepInternal(name,skill,h100,setup,minW,maxW,split,machineType,machineMode,direct100){return {id:uid('st'),name,type:'internal',skill,hoursPer100:h100,setupMinutes:setup,minWorkers:minW,maxWorkers:maxW,splitAllowed:split,machineType,machineMode,directCostPer100:direct100}}
function stepExternal(name,days,vendor,cost){return {id:uid('st'),name,type:'external',externalDays:days,vendor,externalCost:cost}}
let state=load();
if(!state.scheduleGeneratedAt){scheduleAll(false);save()}

function setPage(p){currentPage=p;render()}
function renderNav(){
 let html=''; for(const g of PAGES){html+=`<div class="nav-group">${g.g}</div>`+g.items.map(p=>`<button class="nav-btn ${p===currentPage?'active':''}" onclick="setPage('${p}')">${p}</button>`).join('')}
 html+=`<div class="side-note"><b>v15 간트 중심 현장 버전</b><br>간트가 생산계획의 원본입니다. 이동·길이·작업자·설비·시간을 간트에서 직접 편집하고 다른 화면과 자동 동기화합니다. MES 데이터는 자금관리와 분리된 서버 저장소에 저장됩니다.</div>`;$('sidebar').innerHTML=html;
 const m=['홈','프로젝트','생산','손익','관리'];$('mobileNav').innerHTML=m.map(p=>`<button class="${p===currentPage?'active':''}" onclick="setPage('${p}')">${p}</button>`).join('')
}
function render(){renderNav();const c=$('content');const map={'홈':homePage,'프로젝트':projectsPage,'생산':productionHubPage,'손익':profitPage,'관리':managementPage,'의사결정':decisionPage};c.innerHTML=(map[currentPage]||homePage)()}

function tabButton(active,key,label,fn){return `<button class="subtab ${active===key?'active':''}" onclick="${fn}">${label}</button>`}
function productionHubPage(){return `<div class="subtabs">${tabButton(productionTab,'plan','전체 생산일정',`productionTab='plan';render()`)}${tabButton(productionTab,'workers','작업자 할 일',`productionTab='workers';render()`)}</div>${productionTab==='workers'?workerSchedulePage():planPage()}`}
function managementPage(){return `<div class="subtabs">${tabButton(manageTab,'workers','작업자',`manageTab='workers';render()`)}${tabButton(manageTab,'machines','설비',`manageTab='machines';render()`)}${tabButton(manageTab,'vendors','외주',`manageTab='vendors';render()`)}${tabButton(manageTab,'templates','공정 템플릿',`manageTab='templates';render()`)}${tabButton(manageTab,'settings','설정·이력',`manageTab='settings';render()`)}</div>${manageTab==='machines'?machinesPage():manageTab==='vendors'?vendorsPage():manageTab==='templates'?templatesPage():manageTab==='settings'?settingsPage():workersPage()}`}
function projectFinish(p){const s=(p.schedule||[]).filter(x=>x.end);return s.length?s.map(x=>x.end).sort().at(-1):null}
function projectRisk(p){const finish=projectFinish(p);if(!finish)return {level:'warn',label:'미계획',days:null};const target=addDays(p.dueDate,-state.settings.bufferDays);const d=dayDiff(finish,target);if(d>=2)return {level:'ok',label:`${d}일 여유`,days:d};if(d>=0)return {level:'warn',label:d===0?'버퍼 없이 완료':`${d}일 여유`,days:d};return {level:'bad',label:`${Math.abs(d)}일 초과`,days:d}}
function getWorker(id){return state.workers.find(x=>x.id===id)}function getMachine(id){return state.machines.find(x=>x.id===id)}
function processCost(p,step,scheduleStep){
 if(step.type==='external')return {labor:0,outsource:Number(step.externalCost)||0,direct:0};
 const ph=((Number(p.qty)||0)/100)*(Number(step.hoursPer100)||0)+(Number(step.setupMinutes)||0)/60;
 let labor=0;if(scheduleStep&&scheduleStep.segments?.length){for(const seg of scheduleStep.segments){for(const a of seg.workerAlloc||[]){const w=getWorker(a.id);labor+=(Number(a.hours)||0)*(Number(w?.hourlyCost)||0)}}}else{const eligible=eligibleWorkers(step);const avg=eligible.length?eligible.reduce((a,w)=>a+Number(w.hourlyCost||0),0)/eligible.length:0;labor=ph*avg}
 return {labor,outsource:0,direct:(Number(step.directCostPer100)||0)*(Number(p.qty)||0)/100}
}
function projectFinance(p){let labor=0,outsource=0,direct=0;(p.processes||[]).forEach(st=>{const ss=(p.schedule||[]).find(x=>x.stepId===st.id);const c=processCost(p,st,ss);labor+=c.labor;outsource+=c.outsource;direct+=c.direct});const material=Number(p.materialCost)||0,other=Number(p.otherCost)||0,total=material+other+labor+outsource+direct,revenue=Number(p.revenue)||0,profit=revenue-total,margin=revenue?profit/revenue*100:0;return {revenue,material,other,labor,outsource,direct,total,profit,margin}}
function monthFinance(month){const ps=state.projects.filter(p=>(p.dueDate||'').slice(0,7)===month&&!['취소'].includes(p.status));const agg={revenue:0,material:0,labor:0,outsource:0,direct:0,other:0,total:0,projectProfit:0};for(const p of ps){const f=projectFinance(p);for(const k of Object.keys(agg))if(k in f)agg[k]+=f[k];agg.projectProfit+=f.profit}agg.fixed=Number(state.settings.monthlyFixedCost)||0;agg.operatingProfit=agg.projectProfit-agg.fixed;agg.margin=agg.revenue?agg.operatingProfit/agg.revenue*100:0;return {projects:ps,...agg}}
function todayAssignments(date=selectedWorkDate){const out=[];for(const p of state.projects){for(const s of p.schedule||[]){for(const seg of s.segments||[]){if(seg.date!==date)continue;for(const a of seg.workerAlloc||[])out.push({workerId:a.id,hours:a.hours,project:p,step:s,qty:seg.qty||0,machines:seg.machineIds||[]})}}}return out}
function resourceUtil(date){const wa={};const ma={};for(const a of todayAssignments(date)){wa[a.workerId]=(wa[a.workerId]||0)+a.hours;for(const m of a.machines)ma[m]=(ma[m]||0)+a.hours}return {wa,ma}}
function workerAttendanceState(w,date){
 const ex=w?.attendance?.[date];
 if(ex)return ex.status||'work';
 const dow=parseDate(date).getDay();
 return (w?.workDays||[1,2,3,4,5,6]).includes(dow)?'work':'off';
}
function workerCapacity(w,date){
 if(!w||w.active===false)return 0;
 const ex=w.attendance?.[date];
 if(ex){
   if(ex.status==='off')return 0;
   if(ex.status==='half')return Math.max(.5,Number(ex.hours)||Number(w.dailyHours||8)/2);
   if(ex.status==='overtime')return Math.max(Number(w.dailyHours)||8,Number(ex.hours)||Number(w.maxDailyHours)||Number(w.dailyHours)||8);
   return Math.max(.5,Number(ex.hours)||Number(w.dailyHours)||state.settings.workHours);
 }
 const dow=parseDate(date).getDay();
 return (w.workDays||[1,2,3,4,5,6]).includes(dow)?Number(w.dailyHours||state.settings.workHours):0;
}
function attendanceLabel(w,date){
 const ex=w?.attendance?.[date],st=workerAttendanceState(w,date);
 if(ex?.status==='off')return '휴무';
 if(ex?.status==='half')return '반차';
 if(ex?.status==='overtime')return '특근';
 if(ex?.status==='work')return '출근';
 return st==='work'?'기본 출근':'기본 휴무';
}

function riskAlerts(){const active=state.projects.filter(p=>!['완료','취소'].includes(p.status));const bad=active.filter(p=>projectRisk(p).level==='bad');const issues=state.lastIssues||[];let html='';for(const p of bad){const r=projectRisk(p);html+=`<div class="alert-box bad"><b>${esc(p.client)} · ${esc(p.product)}</b><br>예상 완료 ${fmtFull(projectFinish(p))} · 목표 완료일보다 ${Math.abs(r.days)}일 늦습니다.</div>`}for(const i of issues.slice(0,4))html+=`<div class="alert-box warn"><b>${esc(i.projectName||'생산계획')}</b><br>${esc(i.message)}</div>`;return html||`<div class="alert-box ok"><b>현재 큰 위험 없음</b><br>등록된 자원과 일정 기준으로 주요 납기 충돌이 없습니다.</div>`}

function planPage(){const rows=[];state.projects.forEach(p=>(p.schedule||[]).forEach(s=>rows.push({p,s})));let min=localDate(),max=addDays(min,20);if(rows.length){min=rows.map(x=>x.s.start).filter(Boolean).sort()[0]||min;max=rows.map(x=>x.s.end).filter(Boolean).sort().at(-1)||max}let days=clamp(dayDiff(min,max)+1,14,35);max=addDays(min,days-1);let header='';for(let i=0;i<days;i++)header+=`<div>${fmtDate(addDays(min,i))}</div>`;let body='';for(const p of state.projects){for(const s of p.schedule||[]){if(!s.start||s.start>max)continue;const off=clamp(dayDiff(min,s.start),0,days-1),span=clamp(dayDiff(s.start,s.end)+1,1,days-off),r=projectRisk(p);body+=`<div class="timeline-row" style="--days:${days}"><div class="timeline-label"><strong>${esc(p.client)} · ${esc(s.name)} ${s.locked?'🔒':''}</strong><small>${fmtDate(s.start)}~${fmtDate(s.end)} · ${s.type==='external'?'외주':`${num(s.personHours,1)} 인시`}</small></div>${Array.from({length:days},(_,i)=>i===off?`<div class="timeline-cell"><div class="timeline-bar ${s.type==='external'?'external':''} ${r.level==='bad'?'late':''} ${s.locked?'locked':''}" style="width:calc(${span} * 34px - 3px)">${esc(s.name)}</div></div>`:`<div class="timeline-cell"></div>`).join('')}</div>`}}

function toggleAttendanceDate(date){attendanceSelected=attendanceSelected.includes(date)?attendanceSelected.filter(x=>x!==date):[...attendanceSelected,date];render()}
function applyAttendance(status){const w=state.workers.find(x=>x.id===attendanceWorkerId);if(!w||!attendanceSelected.length)return toast('날짜를 먼저 선택해주세요.','',true);for(const d of attendanceSelected){if(status==='default')delete w.attendance[d];else if(status==='off')w.attendance[d]={status:'off',hours:0};else if(status==='half')w.attendance[d]={status:'half',hours:Number(w.dailyHours||8)/2};else if(status==='overtime')w.attendance[d]={status:'overtime',hours:w.overtimeAllowed?Number(w.maxDailyHours||w.dailyHours||8):Number(w.dailyHours||8)};else w.attendance[d]={status:'work',hours:Number(w.dailyHours||8)}}log('근무일정 변경',`${w.name} · ${attendanceSelected.length}일 · ${status}`);attendanceSelected=[];scheduleAll(false);save();render();toast('근무일정을 반영했습니다.','생산 일정도 새 근무일 기준으로 다시 계산했습니다.')}
function workersPage(){return `<div class="page-head"><div><h1>작업자 관리</h1><div class="sub">가능 공정·임금·기본 근무패턴과 날짜별 실제 출근 여부를 함께 관리합니다.</div></div><button class="btn accent" onclick="openWorkerModal()">+ 작업자 등록</button></div><div class="grid3">${state.workers.map(w=>`<div class="section" style="margin-top:0"><div class="section-title"><h2>${esc(w.name)}</h2><span class="pill ${w.active?'ok':'bad'}">${w.active?'가동':'중지'}</span></div><div class="row"><span>기본 근무</span><b>${esc(weekNames(w.workDays))}</b></div><div class="row"><span>기본 / 최대시간</span><b>${w.dailyHours}h / ${w.maxDailyHours||w.dailyHours}h</b></div><div class="row"><span>시간당 내부원가</span><b>${money(w.hourlyCost)}</b></div><div style="margin-top:8px">${w.skills.map(s=>`<span class="pill accent" style="margin:2px">${esc(s)}</span>`).join('')}</div><div class="form-actions"><button class="btn small" onclick="attendanceWorkerId='${w.id}';render()">근무표 보기</button><button class="btn small" onclick="openWorkerModal('${w.id}')">수정</button><button class="btn small danger" onclick="deleteWorker('${w.id}')">삭제</button></div></div>`).join('')}</div>${attendanceCalendar()}`}

function machinesPage(){return `<div class="page-head"><div><h1>설비</h1><div class="sub">기기 종류와 일일 가용시간을 기준으로 작업자와 함께 중복 없이 자동 배정합니다.</div></div><button class="btn accent" onclick="openMachineModal()">+ 설비 등록</button></div><div class="grid3">${state.machines.map(m=>`<div class="section" style="margin-top:0"><div class="section-title"><h2>${esc(m.name)}</h2><span class="pill ${m.active?'ok':'bad'}">${m.active?'사용 가능':'사용 불가'}</span></div><div class="row"><span>종류</span><b>${esc(m.type)}</b></div><div class="row"><span>하루 가용</span><b>${m.dailyHours}시간</b></div><div class="form-actions"><button class="btn small" onclick="openMachineModal('${m.id}')">수정</button><button class="btn small danger" onclick="deleteMachine('${m.id}')">삭제</button></div></div>`).join('')}</div>`}
function vendorsPage(){return `<div class="page-head"><div><h1>외주</h1><div class="sub">나염·자수·워싱 등 외주업체의 기본 리드타임을 관리합니다.</div></div><button class="btn accent" onclick="openVendorModal()">+ 외주업체</button></div><div class="section"><div class="table-wrap"><table><thead><tr><th>업체</th><th>분류</th><th>기본 소요일</th><th>상태</th><th>관리</th></tr></thead><tbody>${state.vendors.map(v=>`<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.category)}</td><td>${v.leadDays}일</td><td><span class="pill ${v.active?'ok':'bad'}">${v.active?'사용':'중지'}</span></td><td><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn small" onclick="openVendorModal('${v.id}')">수정</button><button class="btn small danger" onclick="deleteVendor('${v.id}')">삭제</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function templatesPage(){return `<div class="page-head"><div><h1>공정 템플릿</h1><div class="sub">제품군별 기본 공정, 준비시간, 복수 작업자 범위, 외주·직접비를 미리 저장합니다.</div></div><button class="btn accent" onclick="openTemplateModal()">+ 템플릿</button></div>${state.templates.map(t=>`<div class="section"><div class="section-title"><div><h2>${esc(t.name)}</h2><span class="hint">${esc(t.description||'')}</span></div><button class="btn small" onclick="openTemplateModal('${t.id}')">수정</button></div><div class="process-list">${t.steps.map((s,i)=>processCard(s,i,false)).join('')}</div></div>`).join('')}`}

function profitPage(){const month=window.profitMonth||localDate().slice(0,7);const f=monthFinance(month);return `<div class="page-head"><div><h1>손익</h1><div class="sub">작업자 임금, 외주비, 재료비, 공정 직접비를 합쳐 프로젝트와 월별 예상 손익을 봅니다.</div></div><div class="month-switch"><input type="month" value="${month}" onchange="window.profitMonth=this.value;render()"></div></div><div class="kpi-grid"><div class="kpi money"><div class="label">월 예상 매출</div><div class="value">${money(f.revenue)}</div><div class="note">납기일이 ${month}인 프로젝트</div></div><div class="kpi"><div class="label">프로젝트 직접원가</div><div class="value">${money(f.total)}</div><div class="note">재료+인건비+외주+공정비+기타</div></div><div class="kpi"><div class="label">월 고정비</div><div class="value">${money(f.fixed)}</div><div class="note">설정에서 변경</div></div><div class="kpi ${f.operatingProfit<0?'alert':'good'}"><div class="label">월 예상 영업이익</div><div class="value ${f.operatingProfit>=0?'profit-positive':'profit-negative'}">${money(f.operatingProfit)}</div><div class="note">영업이익률 ${pct(f.margin)}</div></div></div><div class="section"><div class="section-title"><h2>프로젝트별 손익</h2><span class="hint">현재 생산계획 기준 예상치</span></div><div class="table-wrap"><table><thead><tr><th>프로젝트</th><th>매출</th><th>재료비</th><th>인건비</th><th>외주비</th><th>공정/기타</th><th>총원가</th><th>예상이익</th><th>마진</th></tr></thead><tbody>${f.projects.map(p=>{const x=projectFinance(p);return `<tr><td><b>${esc(p.client)}</b><br>${esc(p.product)}</td><td>${money(x.revenue)}</td><td>${money(x.material)}</td><td>${money(x.labor)}</td><td>${money(x.outsource)}</td><td>${money(x.direct+x.other)}</td><td>${money(x.total)}</td><td class="${x.profit>=0?'profit-positive':'profit-negative'}"><b>${money(x.profit)}</b></td><td><span class="pill ${x.margin>=state.settings.minMargin?'ok':'bad'}">${pct(x.margin)}</span></td></tr>`}).join('')||'<tr><td colspan="9">해당 월 프로젝트가 없습니다.</td></tr>'}</tbody></table></div></div><div class="alert-box warn" style="margin-top:12px"><b>숫자 기준</b><br>프로젝트 이익은 직접 생산원가를 제외한 값이고, 월 영업이익은 여기에 월 고정비까지 뺀 값입니다. 실제 회계 순이익과는 구분해서 보는 것을 권장합니다.</div>`}

function decisionPage(){return `<div class="page-head"><div><h1>수주 의사결정</h1><div class="sub">새 주문을 현재 생산계획에 넣었을 때 납기 가능성과 예상 마진을 동시에 계산합니다.</div></div></div><div class="decision-layout"><div class="section" style="margin-top:0"><div class="section-title"><h2>가상 주문</h2><span class="hint">실제 프로젝트로 저장되지 않음</span></div><div class="form-grid"><div class="field"><label>고객사</label><input id="dClient" value="신규 고객사"></div><div class="field"><label>제품명</label><input id="dProduct" value="후드 추가 주문"></div><div class="field"><label>수량</label><input id="dQty" type="number" min="1" value="400"></div><div class="field"><label>희망 납기</label><input id="dDue" type="date" value="${addDays(localDate(),18)}"></div><div class="field"><label>예상 매출</label><input id="dRevenue" type="number" value="12000000"></div><div class="field"><label>예상 재료비</label><input id="dMaterial" type="number" value="4300000"></div><div class="field"><label>공정 템플릿</label><select id="dTpl">${state.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>우선순위</label><select id="dPriority"><option>보통</option><option>높음</option><option>긴급</option></select></div></div><div class="form-actions"><button class="btn accent" onclick="runDecision()">이 주문 받을 수 있나?</button></div></div><div id="decisionResult" class="decision-result"><div class="muted" style="font-size:11px">왼쪽 조건을 입력하고 계산하면 생산 가능성, 기존 주문 영향, 예상원가와 마진을 함께 보여줍니다.</div></div></div>`}
function runDecision(){const tpl=state.templates.find(t=>t.id===$('dTpl').value);if(!tpl)return;const fake={id:'decision',client:$('dClient').value.trim()||'가상 주문',product:$('dProduct').value.trim()||'제품',qty:Number($('dQty').value)||1,startDate:normalizeWorkday(localDate()),dueDate:$('dDue').value,priority:$('dPriority').value,status:'확정',revenue:Number($('dRevenue').value)||0,materialCost:Number($('dMaterial').value)||0,otherCost:0,processes:clone(tpl.steps),schedule:[]};const baseFinish=Object.fromEntries(state.projects.map(p=>[p.id,projectFinish(p)]));const simProjects=clone(state.projects);simProjects.forEach(p=>(p.schedule||[]).forEach(s=>s.locked=false));simProjects.push(fake);const res=buildSchedule(simProjects,{preserveLocks:false,writeBack:true});const fp=simProjects.find(p=>p.id==='decision');const fin=projectFinish(fp),target=addDays(fake.dueDate,-state.settings.bufferDays),slack=fin?dayDiff(fin,target):-999;const f=projectFinanceWithProjects(fp,simProjects);const impacts=simProjects.filter(p=>p.id!=='decision').map(p=>({p,before:baseFinish[p.id],after:projectFinish(p)})).filter(x=>x.before&&x.after&&x.after>x.before);const marginOk=f.margin>=state.settings.minMargin,deadlineOk=slack>=0;let grade=deadlineOk&&marginOk?'수주 권장':(deadlineOk||marginOk?'조건부 검토':'수주 비추천'),cls=deadlineOk&&marginOk?'good':(deadlineOk||marginOk?'warn':'bad');let html=`<div class="muted" style="font-size:10px">의사결정 결과</div><div class="decision-grade ${cls}">${grade}</div><div class="money-line"><div class="money-mini"><span>예상 완료</span><b>${fmtFull(fin)}</b></div><div class="money-mini"><span>납기 여유</span><b>${slack>=0?slack+'일':Math.abs(slack)+'일 지연'}</b></div><div class="money-mini"><span>예상이익</span><b>${money(f.profit)}</b></div><div class="money-mini"><span>예상마진</span><b>${pct(f.margin)}</b></div></div><div class="row"><span>예상 매출</span><b>${money(f.revenue)}</b></div><div class="row"><span>예상 총원가</span><b>${money(f.total)}</b></div><div class="row"><span>인건비</span><b>${money(f.labor)}</b></div><div class="row"><span>외주비</span><b>${money(f.outsource)}</b></div>`;if(impacts.length)html+=`<div class="alert-box warn" style="margin-top:10px"><b>기존 프로젝트 영향 ${impacts.length}건</b><br>${impacts.slice(0,3).map(x=>`${esc(x.p.client)} ${fmtDate(x.before)}→${fmtDate(x.after)}`).join('<br>')}</div>`;const related=res.issues.filter(i=>i.projectId==='decision');if(related.length)html+=`<div class="alert-box bad" style="margin-top:8px"><b>자원 병목</b><br>${related.map(x=>esc(x.message)).join('<br>')}</div>`;if(!marginOk)html+=`<div class="alert-box warn" style="margin-top:8px">설정된 최소 목표마진 ${state.settings.minMargin}%보다 낮습니다. 단가 인상, 외주비 조정 또는 공정시간 절감 검토가 필요합니다.</div>`;$('decisionResult').innerHTML=html}
function projectFinanceWithProjects(p,projects){let labor=0,outsource=0,direct=0;(p.processes||[]).forEach(st=>{const ss=(p.schedule||[]).find(x=>x.stepId===st.id);if(st.type==='external')outsource+=Number(st.externalCost)||0;else{for(const seg of ss?.segments||[]){for(const a of seg.workerAlloc||[]){const w=state.workers.find(x=>x.id===a.id);labor+=a.hours*(w?.hourlyCost||0)}}direct+=(Number(st.directCostPer100)||0)*p.qty/100}});const total=(Number(p.materialCost)||0)+(Number(p.otherCost)||0)+labor+outsource+direct,revenue=Number(p.revenue)||0,profit=revenue-total;return {revenue,labor,outsource,direct,total,profit,margin:revenue?profit/revenue*100:0}}

function logsPage(){return `<div class="page-head"><div><h1>변경이력</h1><div class="sub">프로젝트 수정, 일정 재계산, 일정 잠금·해제 등 주요 관리자 변경을 확인합니다.</div></div><button class="btn danger" onclick="clearLogs()">이력 비우기</button></div><div class="section">${state.logs.length?state.logs.map(l=>`<div class="log-item"><div class="log-time">${new Date(l.at).toLocaleString('ko-KR')}</div><div class="log-action">${esc(l.action)}</div><div class="log-detail">${esc(l.detail)}</div></div>`).join(''):`<div class="muted" style="font-size:11px">아직 변경이력이 없습니다.</div>`}</div>`}
function clearLogs(){if(!confirm('변경이력을 모두 지울까요?'))return;state.logs=[];save();render();toast('변경이력을 비웠습니다.')}
function settingsPage(){return `<div class="page-head"><div><h1>설정 / 변경이력</h1><div class="sub">공장 기본값과 관리자 변경기록을 한 화면에서 관리합니다.</div></div></div><div class="grid2"><div class="section"><div class="section-title"><h2>생산 기준</h2></div><div class="form-grid"><div class="field"><label>기본 하루 근무시간</label><input id="sHours" type="number" value="${state.settings.workHours}"></div><div class="field"><label>납기 안전 버퍼(일)</label><input id="sBuffer" type="number" min="0" value="${state.settings.bufferDays}"></div><div class="field"><label>최소 목표마진(%)</label><input id="sMargin" type="number" min="0" max="100" value="${state.settings.minMargin}"></div><div class="field"><label>월 고정비</label><input id="sFixed" type="number" value="${state.settings.monthlyFixedCost}"></div></div><div class="form-actions"><button class="btn accent" onclick="saveSettings()">설정 저장</button></div></div><div class="section"><div class="section-title"><h2>미리보기 데이터</h2></div><div class="alert-box">이 파일은 서버 공유 버전이 아니라 기능·화면을 검토하기 위한 브라우저 저장형 미리보기입니다.</div><div class="form-actions"><button class="btn danger" onclick="resetDemo()">샘플 초기화</button></div></div></div><div class="section"><div class="section-title"><div><h2>최근 변경이력</h2><span class="hint">프로젝트·근무표·잠금·일정 재계산 등의 관리자 변경</span></div><button class="btn small danger" onclick="clearLogs()">이력 비우기</button></div>${state.logs.length?state.logs.slice(0,80).map(l=>`<div class="log-item"><div class="log-time">${new Date(l.at).toLocaleString('ko-KR')}</div><div class="log-action">${esc(l.action)}</div><div class="log-detail">${esc(l.detail)}</div></div>`).join(''):`<div class="muted" style="font-size:11px">아직 변경이력이 없습니다.</div>`}</div>`}

function saveSettings(){state.settings.workHours=Number($('sHours').value)||8;state.settings.bufferDays=Math.max(0,Number($('sBuffer').value)||0);state.settings.minMargin=Math.max(0,Number($('sMargin').value)||0);state.settings.monthlyFixedCost=Math.max(0,Number($('sFixed').value)||0);log('설정 변경','공장 생산/손익 기본값 수정');save();scheduleAll(false);render();toast('설정이 저장되었습니다.')}
function resetDemo(){if(!confirm('샘플 데이터를 처음 상태로 되돌릴까요?'))return;state=seed();scheduleAll(false);save();render();toast('샘플 데이터를 초기화했습니다.')}

function processCard(s,i,editable=true){let desc=s.type==='external'?`외주 · ${s.externalDays||1}일 · ${s.vendor||'업체 미지정'} · ${money(s.externalCost||0)}`:`${s.hoursPer100||0} 인시/100장 · 준비 ${s.setupMinutes||0}분 · ${s.minWorkers||1}~${s.maxWorkers||1}명${s.splitAllowed?' 복수배치':' 단일배치'}${s.machineType?' · '+s.machineType:''} · 공정비 ${money((s.directCostPer100||0))}/100장`;return `<div class="process-card"><div class="process-no">${i+1}</div><div><strong>${esc(s.name)}</strong><small>${esc(desc)}</small></div>${editable?`<div class="actions"><button class="btn small" onclick="editDraftStep(${i})">수정</button><button class="btn small" onclick="moveDraftStep(${i},-1)">↑</button><button class="btn small" onclick="moveDraftStep(${i},1)">↓</button><button class="btn small danger" onclick="removeDraftStep(${i})">삭제</button></div>`:''}</div>`}
function openProjectModal(id=null){editingProjectId=id;const p=id?state.projects.find(x=>x.id===id):null;draftSteps=p?clone(p.processes||[]):clone(state.templates[0]?.steps||[]);$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal wide"><div class="section-title"><h2>${p?'프로젝트 수정':'신규 프로젝트 등록'}</h2><button class="btn small" onclick="closeModal()">닫기</button></div><div class="form-grid"><div class="field"><label>고객사</label><input id="pClient" value="${esc(p?.client||'')}"></div><div class="field"><label>제품명</label><input id="pProduct" value="${esc(p?.product||'')}"></div><div class="field"><label>수량</label><input id="pQty" type="number" min="1" value="${p?.qty||100}"></div><div class="field"><label>납기일</label><input id="pDue" type="date" value="${p?.dueDate||addDays(localDate(),14)}"></div><div class="field"><label>생산 시작 가능일</label><input id="pStart" type="date" value="${p?.startDate||normalizeWorkday(localDate())}"></div><div class="field"><label>우선순위</label><select id="pPriority">${['보통','높음','긴급'].map(x=>`<option ${p?.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>상태</label><select id="pStatus">${['문의','확정','생산중','완료','취소'].map(x=>`<option ${p?.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>템플릿 불러오기</label><select onchange="applyTemplate(this.value)"><option value="">선택</option>${state.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>프로젝트 매출</label><input id="pRevenue" type="number" value="${p?.revenue||0}"></div><div class="field"><label>재료비</label><input id="pMaterial" type="number" value="${p?.materialCost||0}"></div><div class="field"><label>기타 직접비</label><input id="pOther" type="number" value="${p?.otherCost||0}"></div><div class="field span2"><label>메모</label><textarea id="pMemo">${esc(p?.memo||'')}</textarea></div></div><div class="section" style="box-shadow:none"><div class="section-title"><div><h2>생산 공정</h2><span class="hint">준비시간은 공정 시작 시 1회 추가됩니다. 복수 배치를 허용하면 자동계획이 설정 범위 안에서 작업자를 여러 명 붙입니다.</span></div><button class="btn small accent" onclick="openStepModal()">+ 공정 추가</button></div><div id="draftList" class="process-list">${draftSteps.map((s,i)=>processCard(s,i,true)).join('')}</div></div><div class="form-actions"><button class="btn accent" onclick="saveProject()">저장 후 일정 재계산</button></div></div></div>`}
function applyTemplate(id){const t=state.templates.find(x=>x.id===id);if(!t)return;draftSteps=clone(t.steps);renderDraft()}
function renderDraft(){if($('draftList'))$('draftList').innerHTML=draftSteps.map((s,i)=>processCard(s,i,true)).join('')}
function openStepModal(index=null){const s=index===null?null:draftSteps[index];$('modalRoot').insertAdjacentHTML('beforeend',`<div class="modal-back step-editor" style="z-index:190"><div class="modal"><div class="section-title"><h2>${s?'공정 수정':'공정 추가'}</h2><button class="btn small" onclick="closeStepEditor()">뒤로</button></div><div class="form-grid"><div class="field"><label>공정명</label><input id="stName" value="${esc(s?.name||'')}"></div><div class="field"><label>공정 유형</label><select id="stType" onchange="toggleStepFields()"><option value="internal" ${s?.type!=='external'?'selected':''}>내부 공정</option><option value="external" ${s?.type==='external'?'selected':''}>외주 공정</option></select></div><div id="internalFields" class="span2"><div class="form-grid"><div class="field"><label>필요 기술</label><input id="stSkill" value="${esc(s?.skill||'봉제')}"></div><div class="field"><label>100장당 총 인시</label><input id="stH100" type="number" step="0.5" value="${s?.hoursPer100||10}"><div class="help">작업자 2명이 각각 4시간 일하면 총 8인시로 계산합니다.</div></div><div class="field"><label>준비/교체시간(분)</label><input id="stSetup" type="number" min="0" value="${s?.setupMinutes||0}"><div class="help">실 교체, 바늘/부속 변경, 작업물 세팅 등 공정 시작 시 한 번 추가되는 시간입니다.</div></div><div class="field"><label>공정 직접비 / 100장</label><input id="stDirect" type="number" min="0" value="${s?.directCostPer100||0}"></div><div class="field"><label>최소 투입인원</label><input id="stMinW" type="number" min="1" value="${s?.minWorkers||1}"></div><div class="field"><label>최대 투입인원</label><input id="stMaxW" type="number" min="1" value="${s?.maxWorkers||1}"></div><div class="field"><label>복수 작업자 배치</label><select id="stSplit"><option value="yes" ${s?.splitAllowed!==false?'selected':''}>허용</option><option value="no" ${s?.splitAllowed===false?'selected':''}>허용 안 함</option></select></div><div class="field"><label>필요 기기 종류</label><input id="stMachine" value="${esc(s?.machineType||'')}"></div><div class="field"><label>기기 사용 방식</label><select id="stMachineMode"><option value="perWorker" ${s?.machineMode==='perWorker'?'selected':''}>작업자마다 1대</option><option value="shared" ${s?.machineMode!=='perWorker'?'selected':''}>공용 1대</option></select></div></div></div><div id="externalFields" class="span2"><div class="form-grid"><div class="field"><label>외주 소요일</label><input id="stDays" type="number" min="1" value="${s?.externalDays||2}"></div><div class="field"><label>외주업체</label><select id="stVendor"><option value="">선택</option>${state.vendors.map(v=>`<option ${s?.vendor===v.name?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><div class="field"><label>외주 총비용</label><input id="stExternalCost" type="number" min="0" value="${s?.externalCost||0}"></div></div></div></div><div class="form-actions"><button class="btn accent" onclick="saveDraftStep(${index===null?'null':index})">공정 저장</button></div></div></div>`);toggleStepFields()}
function toggleStepFields(){const ext=$('stType')?.value==='external';if($('internalFields'))$('internalFields').classList.toggle('hidden',ext);if($('externalFields'))$('externalFields').classList.toggle('hidden',!ext)}
function saveDraftStep(index){const name=$('stName').value.trim();if(!name)return toast('공정명을 입력해주세요.','',true);let st;if($('stType').value==='external'){st={id:index===null?uid('st'):draftSteps[index].id,name,type:'external',externalDays:Math.max(1,Number($('stDays').value)||1),vendor:$('stVendor').value,externalCost:Number($('stExternalCost').value)||0}}else{let minW=Math.max(1,Number($('stMinW').value)||1),maxW=Math.max(minW,Number($('stMaxW').value)||minW),splitAllowed=$('stSplit').value==='yes';if(!splitAllowed){minW=1;maxW=1}st={id:index===null?uid('st'):draftSteps[index].id,name,type:'internal',skill:$('stSkill').value.trim(),hoursPer100:Math.max(.1,Number($('stH100').value)||1),setupMinutes:Math.max(0,Number($('stSetup').value)||0),minWorkers:minW,maxWorkers:maxW,splitAllowed,machineType:$('stMachine').value.trim(),machineMode:$('stMachineMode').value,directCostPer100:Math.max(0,Number($('stDirect').value)||0)}}if(index===null)draftSteps.push(st);else draftSteps[index]=st;closeStepEditor();renderDraft();toast('공정이 반영되었습니다.')}
function closeStepEditor(){document.querySelector('#modalRoot .step-editor')?.remove()}
function editDraftStep(i){openStepModal(i)}function moveDraftStep(i,d){const n=i+d;if(n<0||n>=draftSteps.length)return;[draftSteps[i],draftSteps[n]]=[draftSteps[n],draftSteps[i]];renderDraft()}function removeDraftStep(i){draftSteps.splice(i,1);renderDraft()}
function saveProject(){const client=$('pClient').value.trim(),product=$('pProduct').value.trim();if(!client||!product)return toast('고객사와 제품명을 입력해주세요.','',true);if(!draftSteps.length)return toast('생산 공정을 1개 이상 등록해주세요.','',true);let p=editingProjectId?state.projects.find(x=>x.id===editingProjectId):null;const isNew=!p;if(!p){p={id:uid('p'),schedule:[]};state.projects.push(p)}Object.assign(p,{client,product,qty:Math.max(1,Number($('pQty').value)||1),dueDate:$('pDue').value,startDate:normalizeWorkday($('pStart').value),priority:$('pPriority').value,status:$('pStatus').value,revenue:Number($('pRevenue').value)||0,materialCost:Number($('pMaterial').value)||0,otherCost:Number($('pOther').value)||0,memo:$('pMemo').value.trim(),processes:clone(draftSteps)});log(isNew?'프로젝트 등록':'프로젝트 수정',`${client} · ${product} / ${p.qty}장`);save();closeModal();scheduleAll(false);render();toast(isNew?'프로젝트가 등록되었습니다.':'프로젝트가 수정되었습니다.')}
function deleteProject(id){const p=state.projects.find(x=>x.id===id);if(!p||!confirm(`${p.client} 프로젝트를 삭제할까요?`))return;state.projects=state.projects.filter(x=>x.id!==id);log('프로젝트 삭제',`${p.client} · ${p.product}`);scheduleAll(false);save();render();toast('프로젝트가 삭제되었습니다.')}

function openWorkerModal(id=null){const w=id?state.workers.find(x=>x.id===id):null;const days=w?.workDays||[1,2,3,4,5,6];$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal" style="width:min(620px,100%)"><div class="section-title"><h2>${w?'작업자 수정':'작업자 등록'}</h2><button class="btn small" onclick="closeModal()">닫기</button></div><div class="form-grid"><div class="field"><label>이름</label><input id="wName" value="${esc(w?.name||'')}"></div><div class="field"><label>기본 하루 근무시간</label><input id="wHours" type="number" step="0.5" value="${w?.dailyHours||8}"></div><div class="field"><label>시간당 내부 원가</label><input id="wCost" type="number" value="${w?.hourlyCost||17000}"></div><div class="field"><label>상태</label><select id="wActive"><option value="yes" ${w?.active!==false?'selected':''}>가동</option><option value="no" ${w?.active===false?'selected':''}>중지</option></select></div><div class="field"><label>잔업 가능</label><select id="wOT"><option value="yes" ${w?.overtimeAllowed!==false?'selected':''}>가능</option><option value="no" ${w?.overtimeAllowed===false?'selected':''}>불가</option></select></div><div class="field"><label>잔업 포함 최대시간</label><input id="wMaxHours" type="number" step="0.5" value="${w?.maxDailyHours||10}"></div><div class="field span2"><label>기본 근무요일</label><div class="weekday-checks">${[['일',0],['월',1],['화',2],['수',3],['목',4],['금',5],['토',6]].map(([n,d])=>`<label><input type="checkbox" class="wday" value="${d}" ${days.includes(d)?'checked':''}> ${n}</label>`).join('')}</div><div class="help">평소 근무패턴입니다. 휴무·반차·특근은 작업자 관리의 근무 캘린더에서 날짜별로 덮어쓸 수 있습니다.</div></div><div class="field span2"><label>가능 기술 (쉼표 구분)</label><input id="wSkills" value="${esc((w?.skills||[]).join(', '))}"></div></div><div class="form-actions"><button class="btn accent" onclick="saveWorker('${id||''}')">저장</button></div></div></div>`}
function saveWorker(id){const name=$('wName').value.trim();if(!name)return;let w=id?state.workers.find(x=>x.id===id):null;if(!w){w={id:uid('w'),attendance:{}};state.workers.push(w)}const workDays=[...document.querySelectorAll('.wday:checked')].map(x=>Number(x.value));Object.assign(w,{name,dailyHours:Math.max(.5,Number($('wHours').value)||8),maxDailyHours:Math.max(.5,Number($('wMaxHours').value)||10),overtimeAllowed:$('wOT').value==='yes',workDays,attendance:w.attendance||{},hourlyCost:Math.max(0,Number($('wCost').value)||0),skills:$('wSkills').value.split(',').map(x=>x.trim()).filter(Boolean),active:$('wActive').value==='yes'});log('작업자 정보 변경',name);save();closeModal();scheduleAll(false);render();toast('작업자 정보가 저장되었습니다.')}

function openMachineModal(id=null){const m=id?state.machines.find(x=>x.id===id):null;$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal" style="width:min(520px,100%)"><div class="section-title"><h2>${m?'설비 수정':'설비 등록'}</h2><button class="btn small" onclick="closeModal()">닫기</button></div><div class="form-grid"><div class="field"><label>설비명</label><input id="mName" value="${esc(m?.name||'')}"></div><div class="field"><label>종류</label><input id="mType" value="${esc(m?.type||'본봉기')}"></div><div class="field"><label>하루 가용시간</label><input id="mHours" type="number" value="${m?.dailyHours||8}"></div><div class="field"><label>상태</label><select id="mActive"><option value="yes" ${m?.active!==false?'selected':''}>사용 가능</option><option value="no" ${m?.active===false?'selected':''}>사용 불가</option></select></div></div><div class="form-actions"><button class="btn accent" onclick="saveMachine('${id||''}')">저장</button></div></div></div>`}
function saveMachine(id){const name=$('mName').value.trim(),type=$('mType').value.trim();if(!name||!type)return;let m=id?state.machines.find(x=>x.id===id):null;if(!m){m={id:uid('m')};state.machines.push(m)}Object.assign(m,{name,type,dailyHours:Math.max(1,Number($('mHours').value)||8),active:$('mActive').value==='yes'});log('설비 정보 변경',`${name} · ${type}`);save();closeModal();scheduleAll(false);render();toast('설비 정보가 저장되었습니다.')}
function openVendorModal(id=null){const v=id?state.vendors.find(x=>x.id===id):null;$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal" style="width:min(520px,100%)"><div class="section-title"><h2>${v?'외주업체 수정':'외주업체 등록'}</h2><button class="btn small" onclick="closeModal()">닫기</button></div><div class="form-grid"><div class="field"><label>업체명</label><input id="vName" value="${esc(v?.name||'')}"></div><div class="field"><label>분류</label><input id="vCat" value="${esc(v?.category||'')}"></div><div class="field"><label>기본 소요일</label><input id="vDays" type="number" value="${v?.leadDays||2}"></div><div class="field"><label>상태</label><select id="vActive"><option value="yes" ${v?.active!==false?'selected':''}>사용</option><option value="no" ${v?.active===false?'selected':''}>중지</option></select></div></div><div class="form-actions"><button class="btn accent" onclick="saveVendor('${id||''}')">저장</button></div></div></div>`}
function saveVendor(id){const name=$('vName').value.trim();if(!name)return;let v=id?state.vendors.find(x=>x.id===id):null;if(!v){v={id:uid('v')};state.vendors.push(v)}Object.assign(v,{name,category:$('vCat').value.trim(),leadDays:Math.max(1,Number($('vDays').value)||1),active:$('vActive').value==='yes'});log('외주업체 정보 변경',name);save();closeModal();render();toast('외주업체 정보가 저장되었습니다.')}
function deleteWorker(id){
 const w=state.workers.find(x=>x.id===id);if(!w)return;if(!confirm(`작업자 '${w.name}'을 삭제할까요?\n현재 생산일정에 배정된 작업도 함께 해제됩니다.`))return;
 let removed=0;for(const p of state.projects)for(const sc of p.schedule||[]){for(const seg of sc.segments||[]){const before=(seg.workerAlloc||[]).length;seg.workerAlloc=(seg.workerAlloc||[]).filter(a=>a.id!==id);removed+=before-seg.workerAlloc.length}refreshScheduleMeta(sc)}
 state.workers=state.workers.filter(x=>x.id!==id);if(attendanceWorkerId===id){attendanceWorkerId=state.workers[0]?.id||null;attendanceSelected=[]}state.lastIssues=collectScheduleWarnings();log('작업자 삭제',`${w.name} · 일정 배정 ${removed}건 해제`);save();closeModal();render();toast('작업자를 삭제했습니다.',removed?`기존 일정 배정 ${removed}건을 해제했습니다. 필요한 공정은 간트에서 다시 배정해주세요.`:'기존 일정 배정은 없었습니다.')
}
function deleteMachine(id){
 const m=state.machines.find(x=>x.id===id);if(!m)return;if(!confirm(`설비 '${m.name}'을 삭제할까요?\n현재 생산일정에서 이 설비 배정도 함께 해제됩니다.`))return;
 let removed=0;for(const p of state.projects)for(const sc of p.schedule||[]){for(const seg of sc.segments||[]){if((seg.machineIds||[]).includes(id))removed++;seg.machineIds=(seg.machineIds||[]).filter(mid=>mid!==id);if(seg.machineHours)delete seg.machineHours[id]}refreshScheduleMeta(sc)}
 state.machines=state.machines.filter(x=>x.id!==id);state.lastIssues=collectScheduleWarnings();log('설비 삭제',`${m.name} · 일정 배정 ${removed}건 해제`);save();closeModal();render();toast('설비를 삭제했습니다.',removed?`기존 일정의 설비 배정 ${removed}건을 해제했습니다.`:'기존 일정 배정은 없었습니다.')
}
function deleteVendor(id){
 const v=state.vendors.find(x=>x.id===id);if(!v)return;if(!confirm(`외주업체 '${v.name}'을 삭제할까요?\n이 업체가 지정된 공정은 '업체 미지정' 상태로 바뀝니다.`))return;
 let cleared=0;for(const t of state.templates)for(const st of t.steps||[]){if(st.type==='external'&&st.vendor===v.name){st.vendor='';cleared++}}
 for(const p of state.projects){for(const st of p.processes||[]){if(st.type==='external'&&st.vendor===v.name){st.vendor='';cleared++}}for(const sc of p.schedule||[]){if(sc.type==='external'&&sc.vendor===v.name){sc.vendor='';cleared++}}}
 state.vendors=state.vendors.filter(x=>x.id!==id);state.lastIssues=collectScheduleWarnings();log('외주업체 삭제',`${v.name} · 연결 공정 ${cleared}건 업체 지정 해제`);save();closeModal();render();toast('외주업체를 삭제했습니다.',cleared?`연결된 공정 ${cleared}건은 업체 미지정으로 바뀌었습니다.`:'연결된 공정은 없었습니다.')
}

function openTemplateModal(id=null){editingTemplateId=id;const t=id?state.templates.find(x=>x.id===id):null;draftSteps=t?clone(t.steps):[];$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal wide"><div class="section-title"><h2>${t?'템플릿 수정':'공정 템플릿 등록'}</h2><button class="btn small" onclick="closeModal()">닫기</button></div><div class="form-grid"><div class="field"><label>템플릿명</label><input id="tName" value="${esc(t?.name||'')}"></div><div class="field"><label>설명</label><input id="tDesc" value="${esc(t?.description||'')}"></div></div><div class="section" style="box-shadow:none"><div class="section-title"><h2>공정 구성</h2><button class="btn small accent" onclick="openTemplateStepModal()">+ 공정 추가</button></div><div id="draftList" class="process-list">${draftSteps.map((s,i)=>processCard(s,i,true)).join('')}</div></div><div class="form-actions"><button class="btn accent" onclick="saveTemplate()">템플릿 저장</button></div></div></div>`}
function openTemplateStepModal(index=null){openStepModal(index)}
