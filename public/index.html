<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강신나 자금관리</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --text:#17191d; --muted:#6b7280; --line:#e5e7eb;
  --dark:#23272f; --danger:#c62828; --income:#176b42; --warn:#9a6700;
  --hustle:#7c3aed; --hustle-soft:#ede9fe;
  --eleven:#f59e0b; --eleven-soft:#ffedd5;
  --loami:#2dd4bf; --loami-soft:#ccfbf1;
  --central:#334155; --central-soft:#e2e8f0;
  --radius:17px; --shadow:0 12px 34px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}.hidden{display:none!important}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.gate{width:min(450px,100%);padding:32px}.eyebrow{font-size:13px;color:var(--muted);margin-bottom:7px}
h1,h2,h3,p{margin-top:0}.gate h1{font-size:28px;margin-bottom:8px}.gate p{color:var(--muted);line-height:1.6}
.pwrow{display:flex;gap:10px;margin-top:20px}.pwrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:13px;padding:15px;font-size:20px;text-align:center;letter-spacing:5px}
.primary,.ghost,.soft-btn{border-radius:12px;font-weight:800}.primary{border:0;background:var(--dark);color:#fff;padding:12px 17px}.ghost{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 13px}.soft-btn{border:1px solid var(--line);background:#fafafa;padding:9px 12px}
.error{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.team-select{width:min(980px,100%)}.select-head{text-align:center;margin-bottom:26px}.select-head h1{font-size:34px;margin-bottom:7px}.select-head p{color:var(--muted)}
.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.team-card{position:relative;overflow:hidden;min-height:165px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:24px;text-align:left;box-shadow:0 5px 20px rgba(0,0,0,.035);transition:.15s}
.team-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.team-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--team-color,var(--central))}
.team-card strong{display:block;font-size:28px;margin-bottom:7px}.team-card span{font-size:14px;color:var(--muted)}
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,247,249,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(229,231,235,.9)}
.topbar-inner{max-width:1280px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand-dot{width:38px;height:38px;border-radius:12px;background:var(--team-color,var(--central));color:#fff;display:grid;place-items:center;font-size:13px}

.week-switcher{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px 7px;min-width:310px;justify-content:center}
.week-switcher button{border:0;background:#f6f7f9;border-radius:9px;width:34px;height:34px;font-weight:900;font-size:18px}
.week-switcher .week-now{width:auto;padding:0 10px;font-size:12px}
.week-info{text-align:center;min-width:170px;line-height:1.25}.week-info strong{display:block;font-size:14px}.week-info small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.request-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.request-card{border:1px solid var(--line);border-left:5px solid var(--team-color,var(--central));border-radius:14px;padding:14px;background:#fff}.request-card h3{font-size:17px;margin-bottom:10px}.request-amount{font-size:24px;font-weight:950;margin:7px 0}.request-actions{display:flex;gap:7px;margin-top:12px}.approve-btn{border:0;background:#176b42;color:#fff;border-radius:10px;padding:9px 12px;font-weight:900}.reject-btn{border:1px solid var(--line);background:#fff;color:var(--danger);border-radius:10px;padding:9px 12px;font-weight:900}.week-chip{display:inline-flex;border-radius:999px;background:#f1f5f9;padding:4px 8px;font-size:11px;font-weight:800;color:#475569}.export-checks{display:flex;gap:12px;flex-wrap:wrap;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fafafa}.export-checks label{font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}.export-checks input{width:17px;height:17px}.success-note{background:#eaf6ef;color:#176b42;border:1px solid #cce8d7;border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700}
.toast-root{position:fixed;top:88px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none;width:min(360px,calc(100vw - 28px))}
.toast-msg{background:#fff;border:1px solid #cfe7d8;border-left:5px solid #176b42;border-radius:14px;padding:13px 15px;box-shadow:0 14px 38px rgba(0,0,0,.14);opacity:0;transform:translateY(-8px);transition:.2s ease;pointer-events:auto}
.toast-msg.show{opacity:1;transform:translateY(0)}
.toast-msg.error{border-color:#f3c7c7;border-left-color:#b42318}
.toast-title{font-size:14px;font-weight:900;color:#17191d}.toast-detail{font-size:12px;color:#6b7280;margin-top:4px;line-height:1.45}
@media(max-width:650px){.toast-root{top:72px;right:14px;left:14px;width:auto}}


.top-actions{display:flex;align-items:center;gap:8px}.notify-wrap{position:relative}.notify-btn{position:relative;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:18px}
.badge{position:absolute;right:-5px;top:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#b42318;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;border:2px solid #fff}
.notify-panel{position:absolute;right:0;top:49px;width:min(400px,calc(100vw - 26px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.16);padding:10px;z-index:50}
.notify-head{display:flex;justify-content:space-between;padding:8px 8px 10px;font-weight:900}.notify-item{border-top:1px solid var(--line);padding:11px 9px}.notify-item strong{display:block;font-size:14px;margin-bottom:4px}.notify-item p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.notify-time{font-size:11px;color:#9ca3af;margin-top:5px}
.layout{max-width:1280px;margin:auto;display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px}
.sidebar{position:sticky;top:78px;align-self:start;height:calc(100vh - 98px);background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px;display:flex;flex-direction:column}
.nav-main{display:flex;flex-direction:column}.nav-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.nav-btn{width:100%;border:0;background:transparent;border-radius:11px;text-align:left;padding:11px 12px;color:#40444c;font-weight:800;margin:2px 0}
.nav-btn.active{background:var(--team-soft,var(--central-soft));color:#111}.nav-btn.debt{font-weight:900}
.content{min-width:0}.page-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:3px 0 16px}.page-head h1{font-size:29px;margin-bottom:4px}.sub{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.stat .label{font-size:13px;color:var(--muted);margin-bottom:9px}.stat .value{font-size:27px;font-weight:900;letter-spacing:-.5px}.stat .small{font-size:12px;color:var(--muted);margin-top:7px}
.section{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px;margin-top:15px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.section-title h2{font-size:19px;margin:0}.hint{font-size:12px;color:var(--muted)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.quick{border:1px solid var(--line);border-radius:15px;background:#fff;padding:16px;text-align:left;min-height:92px}.quick:hover{border-color:#cbd5e1}.quick strong{display:block;font-size:17px;margin-bottom:5px}.quick span{font-size:12px;color:var(--muted)}
.quick.primary-team{background:var(--team-soft,var(--central-soft));border-color:var(--team-color,var(--central))}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed #eceff2;font-size:14px}.row:last-child{border-bottom:0}.row span:first-child{color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#fafafa;color:var(--muted);font-weight:800}
.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;background:#eef0f2}.pill.ok{background:#e8f5ee;color:var(--income)}.pill.wait{background:#fff3d6;color:var(--warn)}.pill.danger{background:#fdecec;color:var(--danger)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 12px;outline:none}.field textarea{min-height:86px;resize:vertical}
.check-line{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafafa}
.check-line input{width:18px;height:18px;margin-top:1px}
.check-line label{margin:0;color:#333;font-size:13px;line-height:1.45;cursor:pointer}
.check-line small{display:block;color:var(--muted);margin-top:3px}
.recurring-mark{font-size:11px;font-weight:900;color:#5b21b6;background:#f3e8ff;border-radius:999px;padding:3px 7px;margin-left:6px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#aeb5bf}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}
.notice{background:#fafafa;border:1px solid var(--line);border-radius:13px;padding:13px 14px;color:#555;font-size:13px;line-height:1.55;margin-bottom:13px}
.plan-list{display:grid;gap:8px}.plan-item{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-left:5px solid var(--team-color,var(--central));border-radius:12px;padding:10px 11px;background:#fff}.plan-date{font-weight:900;font-size:13px}.plan-main strong{display:block;font-size:13px}.plan-main span{font-size:12px;color:var(--muted)}.money-expense{color:var(--danger);font-weight:900}.money-income{color:var(--income);font-weight:900}
.calendar-tools{display:flex;align-items:center;gap:8px}.calendar-title{font-weight:900;min-width:110px;text-align:center}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-head{padding:8px;text-align:center;font-size:12px;font-weight:800;color:var(--muted);background:#fafafa;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{min-height:126px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}.day.muted{background:#fbfbfc;color:#a0a5ad}.day-num{font-size:12px;font-weight:900;margin-bottom:5px}.today .day-num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--dark);color:#fff}
.cal-event{display:block;width:100%;border-radius:7px;padding:5px 6px;margin:4px 0;font-size:11px;font-weight:900;line-height:1.25;border:1px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cal-event.plan{border-style:dashed}.team-hustle{background:var(--hustle-soft);border-color:var(--hustle)}.team-eleven{background:var(--eleven-soft);border-color:var(--eleven)}.team-loami{background:var(--loami-soft);border-color:var(--loami)}.team-central{background:var(--central-soft);border-color:var(--central)}
.day{cursor:pointer;transition:box-shadow .12s ease,background .12s ease;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}.day:hover{box-shadow:inset 0 0 0 2px #dbe3ef}.day.selected-day{box-shadow:inset 0 0 0 2px #334155;background:#f8fafc}.cal-note{margin-top:4px;padding:4px 5px;border-radius:6px;background:#fff7d6;border:1px solid #f0cf66;color:#655000;font-size:10px;font-weight:800;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.balance-forecast{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fafbfc}.forecast-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}.forecast-head h3{font-size:16px;margin:0}.forecast-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.forecast-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.forecast-card .name{font-size:11px;color:var(--muted);font-weight:800}.forecast-card .amount{font-size:17px;font-weight:950;margin-top:5px;word-break:break-all}.forecast-card.total{border-color:#94a3b8;background:#f8fafc}.calendar-click-hint{font-size:12px;color:var(--muted)}@media(max-width:850px){.forecast-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.forecast-card.total{grid-column:1/-1}}
.legend{display:flex;gap:8px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#555}.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.debt-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.debt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.calc-result{background:#fafafa;border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:12px}
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.38);display:grid;place-items:center;padding:18px}.modal{width:min(500px,100%);background:#fff;border-radius:20px;border:1px solid var(--line);padding:21px;box-shadow:0 24px 80px rgba(0,0,0,.22)}.modal h3{font-size:20px;margin-bottom:7px}.modal p{font-size:13px;color:var(--muted);line-height:1.55}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}
.mobile-nav{display:none}
@media(max-width:940px){
 .topbar-inner{flex-wrap:wrap}.week-switcher{order:3;width:100%;min-width:0}.week-info{min-width:150px}.request-grid{grid-template-columns:1fr}
 .layout{grid-template-columns:1fr;padding:14px 14px 86px}.sidebar{display:none}.cards{grid-template-columns:repeat(2,1fr)}.quick-grid{grid-template-columns:repeat(2,1fr)}
 .mobile-nav{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:40;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .mobile-nav button{border:0;background:transparent;padding:8px 2px;font-size:11px;font-weight:800;color:#555}.mobile-nav button.active{color:#111;background:var(--team-soft,var(--central-soft));border-radius:9px}
}
@media(max-width:650px){
 .week-switcher{gap:4px;padding:4px}.week-switcher button{width:31px;height:31px}.week-info strong{font-size:13px}.week-info small{font-size:10px}.week-switcher .week-now{padding:0 7px}
 .center{padding:14px}.gate{padding:25px 19px}.pwrow{flex-direction:column}.pwrow .primary{padding:14px}.team-grid{grid-template-columns:1fr}.team-card{min-height:118px}
 .select-head h1{font-size:28px}.brand span:last-child{display:none}.topbar-inner{padding:10px 12px}.page-head{align-items:flex-start;flex-direction:column}.page-head h1{font-size:25px}
 .cards{grid-template-columns:1fr}.quick-grid,.form-grid,.debt-grid{grid-template-columns:1fr}.stat .value{font-size:24px}.section{padding:15px}.plan-item{grid-template-columns:80px 1fr}.plan-item .soft-btn{grid-column:1/-1}
 .calendar{font-size:10px}.day{min-height:100px;padding:4px}.cal-event{font-size:9px;padding:4px}.calendar-tools{width:100%;justify-content:space-between}
 table{display:block;overflow:auto;white-space:nowrap}
}
.approve-btn:disabled{background:#d1d5db!important;color:#6b7280!important;cursor:not-allowed}.fund-warning{margin-top:8px;padding:8px 10px;border-radius:9px;background:#fff1f2;color:#b42318;font-size:12px;font-weight:800}</style>
</head>
<body>
<section id="passwordScreen" class="center">
  <div class="gate panel">
    <div class="eyebrow">내부 자금관리</div>
    <h1>비밀번호를 입력하세요</h1>
    <p>공용 비밀번호로 접속합니다.</p>
    <div class="pwrow"><input id="pw" inputmode="numeric" maxlength="4" type="password" placeholder="••••"><button class="primary" id="pwBtn">확인</button></div>
    <div id="pwErr" class="error"></div>
  </div>
</section>

<section id="teamScreen" class="center hidden">
  <div class="team-select">
    <div class="select-head"><div class="eyebrow">강신나 자금관리</div><h1>관리 대상을 선택하세요</h1><p>선택한 관리 화면으로 바로 이동합니다.</p></div>
    <div class="team-grid">
      <button class="team-card" data-team="강신나" style="--team-color:var(--central)"><strong>강신나</strong><span>전체 자금 · 일정 · 예산 · 매출 · 부채 관리</span></button>
      <button class="team-card" data-team="허슬" style="--team-color:var(--hustle)"><strong>허슬</strong><span>예산 · 매출 · 지출 · 미리 신고</span></button>
      <button class="team-card" data-team="엘리븐" style="--team-color:var(--eleven)"><strong>엘리븐</strong><span>예산 · 매출 · 지출 · 미리 신고</span></button>
      <button class="team-card" data-team="로아미" style="--team-color:var(--loami)"><strong>로아미</strong><span>예산 · 매출 · 지출 · 미리 신고</span></button>
    </div>
  </div>
</section>

<section id="mainScreen" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><div class="brand-dot">자금</div><span id="brandTitle"></span></div>
      <div class="week-switcher" id="weekSwitcher">
        <button type="button" onclick="moveSelectedWeek(-1)" aria-label="이전 주">‹</button>
        <div class="week-info"><strong id="selectedWeekLabel"></strong><small id="selectedWeekRange"></small><small style="display:block;color:#8a8f9c;margin-top:2px">일요일 시작 · 토요일 종료</small></div>
        <button type="button" onclick="moveSelectedWeek(1)" aria-label="다음 주">›</button>
        <button type="button" class="week-now" onclick="goCurrentWeek()">이번 주</button>
      </div>
      <div class="top-actions">
        <div class="notify-wrap">
          <button class="notify-btn" id="notifyBtn">🔔<span class="badge" id="notifyCount"></span></button>
          <div class="notify-panel hidden" id="notifyPanel"></div>
        </div>
        <button class="ghost" id="switchTeam">팀 변경</button>
        <button class="ghost" id="lockBtn">잠금</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="content"></main>
  </div>
  <nav class="mobile-nav" id="mobileNav"></nav>
  <div id="modalRoot"></div>
</section>

<script>

const TEAM_META={
  "강신나":{class:"team-central",color:"#334155",soft:"#e2e8f0"},
  "허슬":{class:"team-hustle",color:"#7c3aed",soft:"#ede9fe"},
  "엘리븐":{class:"team-eleven",color:"#f59e0b",soft:"#ffedd5"},
  "로아미":{class:"team-loami",color:"#2dd4bf",soft:"#ccfbf1"}
};

function seedState(){
 return {
   accounts:{"강신나":0,"허슬":0,"엘리븐":0,"로아미":0},
   budgets:{
     "허슬":{approved:0,unused:0,extra:0},
     "엘리븐":{approved:0,unused:0,extra:0},
     "로아미":{approved:0,unused:0,extra:0}
   },
   weeklyBudgets:{},
   budgetRequests:[],
   transfers:[],
   calendarNotes:{},
   weekStandard:"sunday",
   sales:[],
   expenses:[],
   plans:[],
   recurringExpenses:[],
   fixedCosts:[],
   debts:[],
   notifications:{
     "강신나":[],
     "허슬":[],
     "엘리븐":[],
     "로아미":[]
   }
 };
}
let state=seedState();
let stateVersion=0;
let currentTeam=null;
let currentPage="홈";
let selectedWeekStart=iso(startOfWeek(todayISO()));
const nowForCalendar=new Date();
let calendarCursor=new Date(nowForCalendar.getFullYear(),nowForCalendar.getMonth(),1);
let selectedCalendarDate=todayISO();
let calendarClickTimer=null;
let calendarSuppressClickUntil=0;
let selectedPlanId=null;
let saveTimer=null;
let saveInFlight=false;
let saveQueued=false;

function normalizeState(s){
 let x=s&&typeof s==="object"?s:seedState();
 if(x.weekStandard!=="sunday")x=migrateWeeksToSunday(x);
 x.accounts=x.accounts||{"강신나":0,"허슬":0,"엘리븐":0,"로아미":0};
 x.budgets=x.budgets||{"허슬":{approved:0,unused:0,extra:0},"엘리븐":{approved:0,unused:0,extra:0},"로아미":{approved:0,unused:0,extra:0}};
 x.weeklyBudgets=x.weeklyBudgets&&typeof x.weeklyBudgets==="object"?x.weeklyBudgets:{};
 x.budgetRequests=Array.isArray(x.budgetRequests)?x.budgetRequests:[];
 x.transfers=Array.isArray(x.transfers)?x.transfers:[];
 x.calendarNotes=x.calendarNotes&&typeof x.calendarNotes==="object"?x.calendarNotes:{};
 const currentWeek=iso(startOfWeek(todayISO()));
 if(!x.weeklyBudgets[currentWeek]){x.weeklyBudgets[currentWeek]={};["허슬","엘리븐","로아미"].forEach(t=>{const b=x.budgets[t]||{approved:0,unused:0,extra:0};x.weeklyBudgets[currentWeek][t]={approved:Number(b.approved)||0,unused:Number(b.unused)||0,extra:Number(b.extra)||0};});}
 x.sales=Array.isArray(x.sales)?x.sales:[];
 x.expenses=Array.isArray(x.expenses)?x.expenses:[];
 x.plans=Array.isArray(x.plans)?x.plans:[];
 x.recurringExpenses=Array.isArray(x.recurringExpenses)?x.recurringExpenses:[];
 x.fixedCosts=Array.isArray(x.fixedCosts)?x.fixedCosts:[];
 x.debts=Array.isArray(x.debts)?x.debts:[];
 x.notifications=x.notifications||{"강신나":[],"허슬":[],"엘리븐":[],"로아미":[]};
 x.expenses.forEach(e=>{if(typeof e.cutBudget!=="boolean")e.cutBudget=false;if(typeof e.budgetDeducted!=="number")e.budgetDeducted=0;if(!e.budgetWeek&&e.date)e.budgetWeek=weekStartISO(e.date);});
 return x;
}
async function loadRemoteState(){
 try{
   const r=await fetch('/api/state',{cache:'no-store'});
   if(r.status===401)return false;
   if(!r.ok)throw new Error('state load failed');
   const data=await r.json();
   const needsWeekMigration=data.state?.weekStandard!=="sunday";
   state=normalizeState(data.state);stateVersion=Number(data.version)||0;
   if(needsWeekMigration)saveState();
   return true;
 }catch(e){console.error(e);return false;}
}
function saveState(){
 saveQueued=true;
 clearTimeout(saveTimer);
 saveTimer=setTimeout(flushSaveState,80);
}
async function flushSaveState(){
 if(saveInFlight){saveQueued=true;return;}
 if(!saveQueued)return;
 saveInFlight=true;saveQueued=false;
 const version=stateVersion;
 const snapshot=JSON.parse(JSON.stringify(state));
 try{
   const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({version,state:snapshot})});
   if(r.status===409){
     const data=await r.json();state=normalizeState(data.state);stateVersion=Number(data.version)||0;
     alert('다른 사용자가 먼저 내용을 변경했습니다. 최신 내용으로 다시 불러왔습니다. 방금 작업은 한 번 더 확인해 주세요.');
     renderApp();return;
   }
   if(r.status===401){showOnly('passwordScreen');return;}
   if(!r.ok)throw new Error('state save failed');
   const data=await r.json();stateVersion=Number(data.version)||stateVersion;
 }catch(e){
   console.error(e);saveQueued=true;showToast('저장 연결에 문제가 있습니다.','인터넷 연결을 확인한 뒤 잠시 후 다시 시도해 주세요.','error');
 }finally{
   saveInFlight=false;
   if(saveQueued)saveTimer=setTimeout(flushSaveState,120);
 }
}
async function syncRemoteState(){
 if(saveInFlight||saveQueued||document.getElementById('mainScreen').classList.contains('hidden'))return;
 try{
   const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)return;
   const data=await r.json();
   if(Number(data.version)>stateVersion){state=normalizeState(data.state);stateVersion=Number(data.version);renderApp();}
 }catch(e){console.error(e);}
}
function lastDayOfMonth(y,m){return new Date(y,m+1,0).getDate()}
function recurringDate(y,m,day){
 const d=Math.min(day,lastDayOfMonth(y,m));
 return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function materializeRecurringExpenses(){
 let changed=false;
 const horizon=new Date(todayISO()+"T00:00:00");
 horizon.setMonth(horizon.getMonth()+18);
 (state.recurringExpenses||[]).filter(r=>r.active!==false).forEach(r=>{
   const start=new Date(r.startDate+"T00:00:00");
   let cursor=new Date(start.getFullYear(),start.getMonth(),1);
   const end=new Date(horizon.getFullYear(),horizon.getMonth(),1);
   while(cursor<=end){
     const date=recurringDate(cursor.getFullYear(),cursor.getMonth(),r.day);
     if(date>=r.startDate){
       const exists=state.plans.some(p=>p.recurringId===r.id&&p.date===date);
       if(!exists){state.plans.push({id:Date.now()+Math.random(),team:r.team,type:"expense",date,amount:r.amount,name:r.name,status:"planned",recurringId:r.id,isRecurring:true});changed=true;}
     }
     cursor.setMonth(cursor.getMonth()+1);
   }
 });
 if(changed)saveState();
}
function won(n){return new Intl.NumberFormat("ko-KR").format(Math.round(Number(n)||0))+"원"}
function shortMoney(n){n=Number(n)||0;if(Math.abs(n)>=100000000)return (n/100000000).toFixed(n%100000000?1:0)+"억";if(Math.abs(n)>=10000)return (n/10000).toFixed(n%10000?1:0)+"만";return new Intl.NumberFormat("ko-KR").format(n)}
function showToast(message,detail="",type="success"){
 let root=document.getElementById("toastRoot");
 if(!root){root=document.createElement("div");root.id="toastRoot";root.className="toast-root";document.body.appendChild(root);}
 const el=document.createElement("div");el.className=`toast-msg ${type==="error"?"error":""}`;
 const title=document.createElement("div");title.className="toast-title";title.textContent=message;el.appendChild(title);
 if(detail){const d=document.createElement("div");d.className="toast-detail";d.textContent=detail;el.appendChild(d);}
 root.appendChild(el);requestAnimationFrame(()=>el.classList.add("show"));
 setTimeout(()=>{el.classList.remove("show");setTimeout(()=>el.remove(),220)},2600);
}

function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function todayLabel(){const d=new Date();return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}
function showOnly(id){["passwordScreen","teamScreen","mainScreen"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function teamStyle(team){const m=TEAM_META[team];document.documentElement.style.setProperty("--team-color",m.color);document.documentElement.style.setProperty("--team-soft",m.soft)}
function notify(team,title,text){state.notifications[team]=state.notifications[team]||[];state.notifications[team].unshift({title,text,time:"방금"});saveState()}
function monthKey(dateStr){return dateStr?.slice(0,7)}
function currentMonth(){return todayISO().slice(0,7)}
function monthSales(team){
 return state.sales.filter(s=>(!team||s.team===team)&&s.status==="입금완료"&&monthKey(s.receivedAt||s.date)===currentMonth()).reduce((a,b)=>a+b.amount,0)
}
function waitingSales(team){return state.sales.filter(s=>(!team||s.team===team)&&s.status==="대기").reduce((a,b)=>a+b.amount,0)}
function monthExpenses(team){return state.expenses.filter(e=>(!team||e.team===team)&&monthKey(e.date)===currentMonth()).reduce((a,b)=>a+b.amount,0)}
function totalCash(){return Object.values(state.accounts).reduce((a,b)=>a+b,0)}
function totalDebt(){return state.debts.reduce((a,b)=>a+b.principal,0)}
function parseMoney(v){return Number(String(v||"").replace(/[^0-9-]/g,""))||0}
function startOfWeek(dateStr){
 const d=new Date(dateStr+"T00:00:00");const day=d.getDay();d.setDate(d.getDate()-day);return d;
}
function endOfWeek(dateStr){const d=startOfWeek(dateStr);d.setDate(d.getDate()+6);return d}
function iso(d){return d.toISOString().slice(0,10)}
function addDaysISO(dateStr,days){const d=new Date(dateStr+"T00:00:00");d.setDate(d.getDate()+days);return iso(d)}
function weekStartISO(dateStr){return iso(startOfWeek(dateStr))}
function weekEndISO(weekStart){return addDaysISO(weekStart,6)}
function migrateWeeksToSunday(data){
 const x=data&&typeof data==="object"?data:{};
 x.weeklyBudgets=x.weeklyBudgets&&typeof x.weeklyBudgets==="object"?x.weeklyBudgets:{};
 const migrated={};
 Object.entries(x.weeklyBudgets).forEach(([oldKey,teams])=>{
   const newKey=weekStartISO(oldKey);
   migrated[newKey]=migrated[newKey]||{};
   Object.entries(teams||{}).forEach(([team,b])=>{
     if(!migrated[newKey][team])migrated[newKey][team]={approved:0,unused:0,extra:0};
     const target=migrated[newKey][team];
     target.approved+=Number(b?.approved)||0;
     target.unused+=Number(b?.unused)||0;
     target.extra+=Number(b?.extra)||0;
   });
 });
 x.weeklyBudgets=migrated;
 (x.budgetRequests||[]).forEach(r=>{if(r.weekStart)r.weekStart=weekStartISO(r.weekStart)});
 (x.expenses||[]).forEach(e=>{if(e.date)e.budgetWeek=weekStartISO(e.date)});
 (x.transfers||[]).forEach(t=>{if(t.weekStart)t.weekStart=weekStartISO(t.weekStart)});
 x.weekStandard="sunday";
 return x;
}
function getWeekBudget(team,weekStart=selectedWeekStart){state.weeklyBudgets=state.weeklyBudgets||{};if(!state.weeklyBudgets[weekStart])state.weeklyBudgets[weekStart]={};if(!state.weeklyBudgets[weekStart][team])state.weeklyBudgets[weekStart][team]={approved:0,unused:0,extra:0};return state.weeklyBudgets[weekStart][team]}
function syncBudgetMirror(){["허슬","엘리븐","로아미"].forEach(t=>{state.budgets[t]=getWeekBudget(t,selectedWeekStart)})}
function previousWeekStart(weekStart=selectedWeekStart){return addDaysISO(weekStart,-7)}
function weekCarryover(team,weekStart=selectedWeekStart){return Number(getWeekBudget(team,previousWeekStart(weekStart)).unused)||0}
function weekLabelInfo(weekStart=selectedWeekStart){const d=new Date(weekStart+"T00:00:00"),y=d.getFullYear(),m=d.getMonth(),day=d.getDate();const first=new Date(y,m,1),offset=first.getDay(),nth=Math.floor((day+offset-1)/7)+1,end=new Date(weekEndISO(weekStart)+"T00:00:00");return {label:`${y}년 ${m+1}월 ${nth}째주`,range:`${m+1}/${day} ~ ${end.getMonth()+1}/${end.getDate()}`}}
function updateWeekSwitcher(){const info=weekLabelInfo(),l=document.getElementById("selectedWeekLabel"),r=document.getElementById("selectedWeekRange");if(l)l.textContent=info.label;if(r)r.textContent=info.range}
window.moveSelectedWeek=function(n){selectedWeekStart=addDaysISO(selectedWeekStart,n*7);sessionStorage.setItem("selectedWeekStart",selectedWeekStart);syncBudgetMirror();renderApp()}
window.goCurrentWeek=function(){selectedWeekStart=weekStartISO(todayISO());sessionStorage.setItem("selectedWeekStart",selectedWeekStart);syncBudgetMirror();renderApp()}
function plansForWeek(team,type,weekStart=selectedWeekStart){const s=weekStart,e=weekEndISO(weekStart);return state.plans.filter(p=>p.team===team&&p.type===type&&p.status==="planned"&&p.date>=s&&p.date<=e).sort((a,b)=>a.date.localeCompare(b.date))}
function dateLabel(s){const d=new Date(s+"T00:00:00");return `${d.getMonth()+1}월 ${d.getDate()}일`}
function stat(label,value,small=""){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div>${small?`<div class="small">${small}</div>`:""}</div>`}

window.saveExpense=function(team){
 const name=document.getElementById("expName").value.trim(),amount=parseMoney(document.getElementById("expAmount").value),date=document.getElementById("expDate").value,account=document.getElementById("expAccount").value,cut=document.getElementById("expBudget").value==="yes";
 if(!name||!amount||!date)return alert("지출명, 금액, 날짜를 입력하세요.");if(state.accounts[account]<amount&&!confirm("계좌잔액보다 큰 지출입니다. 그래도 저장할까요?"))return;
 const vat=Math.round(amount/11),supply=amount-vat;
 const expenseWeek=weekStartISO(date),weekBudget=getWeekBudget(team,expenseWeek);
 const budgetDeducted=cut?Math.min(weekBudget.unused,amount):0;
 state.expenses.push({id:Date.now(),team,name,amount,date,account,vatIncluded:true,vat,supply,cutBudget:cut,budgetDeducted,budgetWeek:expenseWeek});
 state.accounts[account]-=amount;
 if(cut)weekBudget.unused=Math.max(0,weekBudget.unused-budgetDeducted);
 syncBudgetMirror();
 notify(team,"지출 반영",`${name} -${won(amount)} · 계좌잔액 ${won(state.accounts[account])}${cut?` · ${weekLabelInfo(expenseWeek).label} 미사용예산 ${won(weekBudget.unused)}`:""}`);
 notify("강신나",`${team} 지출`,`${name} -${won(amount)} · ${account} 계좌`);
 if(selectedPlanId){const p=state.plans.find(x=>x.id===selectedPlanId);if(p)p.status="realized";selectedPlanId=null}
 saveState();showToast("지출이 등록되었습니다.",`${won(amount)} · 부가세 ${won(vat)} 포함`);renderApp();
}

function bindCalendarLongPress(){
 document.querySelectorAll(".day[data-calendar-date]").forEach(el=>{
   let timer=null,startX=0,startY=0;
   const cancel=()=>{if(timer){clearTimeout(timer);timer=null}};
   el.addEventListener("touchstart",e=>{
     if(e.touches.length!==1)return;
     startX=e.touches[0].clientX;startY=e.touches[0].clientY;
     cancel();
     timer=setTimeout(()=>{
       timer=null;
       calendarSuppressClickUntil=Date.now()+1000;
       const date=el.dataset.calendarDate;
       selectedCalendarDate=date;
       if(navigator.vibrate)try{navigator.vibrate(20)}catch(_){}
       openCalendarDay(date);
     },650);
   },{passive:true});
   el.addEventListener("touchmove",e=>{
     if(!timer||e.touches.length!==1)return;
     const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
     if(Math.hypot(dx,dy)>12)cancel();
   },{passive:true});
   el.addEventListener("touchend",cancel,{passive:true});
   el.addEventListener("touchcancel",cancel,{passive:true});
 });
}
function getCalendarEventsForDate(date){
 const actualSales=state.sales.filter(s=>(s.receivedAt||s.date)===date).map(s=>({date,team:s.team,type:"income",amount:s.amount,name:s.name,planned:false}));
 const actualExp=state.expenses.filter(e=>e.date===date).map(e=>({date,team:e.team,type:"expense",amount:e.amount,name:e.name,planned:false}));
 const plans=state.plans.filter(p=>p.status==="planned"&&p.date===date).map(p=>({...p,planned:true}));
 return [...actualSales,...actualExp,...plans];
}

function xmlEscape(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
window.exportUsageExcel=function(){const start=document.getElementById("exportStart").value,end=document.getElementById("exportEnd").value,team=document.getElementById("exportTeam").value;if(!start||!end||start>end)return alert("시작일과 종료일을 확인하세요.");const teamOk=t=>team==="전체"||t===team,rows=[];if(document.getElementById("exSales").checked)state.sales.forEach(x=>{const d=x.receivedAt||x.date;if(d>=start&&d<=end&&teamOk(x.team))rows.push([d,x.team,"매출",x.name,x.status,Number(x.amount)||0,x.account||"",""])});if(document.getElementById("exExpenses").checked)state.expenses.forEach(x=>{if(x.date>=start&&x.date<=end&&teamOk(x.team))rows.push([x.date,x.team,"지출",x.name,"완료",-(Number(x.amount)||0),x.account||"",`부가세 ${Number(x.vat)||0}`])});if(document.getElementById("exBudgets").checked)state.budgetRequests.forEach(x=>{if(x.weekStart>=start&&x.weekStart<=end&&teamOk(x.team))rows.push([x.weekStart,x.team,"예산요청",weekLabelInfo(x.weekStart).label,x.status,Number(x.status==="승인"?(x.approvedAmount||x.requestedAmount):x.requestedAmount)||0,"팀 예산",x.memo||""])});if(document.getElementById("exTransfers")?.checked)(state.transfers||[]).forEach(x=>{if(x.date>=start&&x.date<=end&&(team==="전체"||x.from===team||x.to===team))rows.push([x.date,`${x.from}→${x.to}`,x.type==="예산지급"?"예산지급":"자금이동",x.memo||"", "완료",Number(x.amount)||0,`${x.from} → ${x.to}`,x.budgetRequestId?`예산요청 #${x.budgetRequestId}`:""])});if(document.getElementById("exPlans").checked)state.plans.filter(x=>x.status==="planned").forEach(x=>{if(x.date>=start&&x.date<=end&&teamOk(x.team))rows.push([x.date,x.team,x.type==="expense"?"예정지출":"예정매출",x.name,"예정",x.type==="expense"?-(Number(x.amount)||0):(Number(x.amount)||0),"",x.isRecurring?"고정 자동등록":"미리 신고"])});rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0]))||String(a[1]).localeCompare(String(b[1])));if(!rows.length)return alert("선택한 조건에 해당하는 내역이 없습니다.");const headers=["날짜","팀","구분","내용","상태","금액","계좌/반영","메모"],makeCell=(v,isNum=false)=>`<Cell><Data ss:Type="${isNum?"Number":"String"}">${xmlEscape(v)}</Data></Cell>`,xml=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="이용내역"><Table><Row>${headers.map(h=>makeCell(h)).join("")}</Row>${rows.map(r=>`<Row>${r.map((v,i)=>makeCell(v,i===5)).join("")}</Row>`).join("")}</Table></Worksheet></Workbook>`,blob=new Blob(["\ufeff",xml],{type:"application/vnd.ms-excel;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`강신나_이용내역_${start}_${end}.xls`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast("엑셀 파일을 다운로드했습니다.",`${start} ~ ${end}`)}

 return `<div class="page-head">

     </div>` : `<div class="empty">등록된 부채가 없습니다. ‘부채 추가’로 현재 대출부터 등록하세요.</div>`}
 </section>

 <section class="section">
   <div class="section-title"><h2>12개월 상환 시뮬레이션</h2><div class="hint">추가 월상환액을 넣어 비교</div></div>
   ${state.debts.length ? `
     <div class="form-grid">
       <div class="field"><label>대출 선택</label>
         <select id="simDebt">${state.debts.map(d=>`<option value="${d.id}">${d.name}</option>`).join("")}</select>

     <div id="simResult" class="calc-result"><div class="row"><span>예상 결과</span><strong>추가 상환액을 입력해 계산하세요.</strong></div></div>
   ` : `<div class="empty">부채를 먼저 등록하면 상환 계획을 계산할 수 있습니다.</div>`}

}

 document.getElementById("modalRoot").innerHTML=`<div class="modal-back"><div class="modal">
   <h3>부채 수정</h3>

window.saveDebtEdit=function(id){
 const d=state.debts.find(x=>x.id===id); if(!d)return;
 const name=document.getElementById("edName").value.trim();
 const principal=parseMoney(document.getElementById("edPrincipal").value);
 const rate=Number(document.getElementById("edRate").value)||0;
 const pay=parseMoney(document.getElementById("edPay").value);
 const day=Math.max(1,Math.min(31,Number(document.getElementById("edDay").value)||1));
 const b=document.getElementById("edBudget").value;
 if(!name||!principal||!pay)return alert("대출명, 현재 원금, 월 납입액을 입력하세요.");
 Object.assign(d,{name,principal,rate,monthlyPayment:pay,paymentDay:day,weekly:b==="both",monthly:b!=="none"});
 notify("강신나","부채 수정",`${name} · 현재 원금 ${won(principal)} · 월 납입 ${won(pay)}`);
 saveState(); closeModal(); showToast("부채 정보가 수정되었습니다.",`${name} · ${won(principal)}`);renderApp();
}

window.deleteDebt=function(id){

 openConfirm("부채 삭제",`${d.name} · ${won(d.principal)} 부채 정보를 삭제할까요?`,()=>{
   state.debts=state.debts.filter(x=>x.id!==id);
   notify("강신나","부채 삭제",`${d.name} 부채 정보가 삭제되었습니다.`);
   saveState();showToast("부채 정보가 삭제되었습니다.",d.name);renderApp();
 });

window.runDebtSim=function(){
 const debtSelect=document.getElementById("simDebt");
 const extraInput=document.getElementById("simExtra");
 const result=document.getElementById("simResult");
 if(!debtSelect||!extraInput||!result)return;
 const id=Number(debtSelect.value);
 const extra=Math.max(0,parseMoney(extraInput.value));
 const d=state.debts.find(x=>x.id===id);
 if(!d)return;
 let p=Number(d.principal)||0,interest=0,totalPaid=0;
 const rows=[];
 for(let i=1;i<=12;i++){
   if(p<=0){rows.push({month:i,interest:0,principal:0,balance:0});continue}
   const im=p*(Number(d.rate)||0)/100/12;
   const payment=Math.min(p+im,(Number(d.monthlyPayment)||0)+extra);
   const principalPay=Math.max(0,Math.min(p,payment-im));
   interest+=im; totalPaid+=payment; p=Math.max(0,p-principalPay);
   rows.push({month:i,interest:im,principal:principalPay,balance:p});
 }
 result.innerHTML=`
   <div class="row"><span>12개월 후 예상 원금</span><strong>${won(p)}</strong></div>
   <div class="row"><span>12개월 예상 이자 합계</span><strong>${won(interest)}</strong></div>
   <div class="row"><span>12개월 예상 총 납입액</span><strong>${won(totalPaid)}</strong></div>
   <div class="row"><span>매월 계획 납입액</span><strong>${won((Number(d.monthlyPayment)||0)+extra)}</strong></div>`;
}
window.openDebtAdd=function(){document.getElementById("modalRoot").innerHTML=`<div class="modal-back"><div class="modal"><h3>부채 추가</h3><p>현재 원금과 월 납입조건을 등록합니다.</p><div class="form-grid"><div class="field"><label>대출명</label><input id="dName"></div><div class="field"><label>현재 원금</label><input id="dPrincipal" inputmode="numeric"></div><div class="field"><label>금리(%)</label><input id="dRate" type="number" step="0.1"></div><div class="field"><label>월 납입액</label><input id="dPay" inputmode="numeric"></div><div class="field"><label>납입일</label><input id="dDay" type="number" min="1" max="31" value="15"></div><div class="field"><label>예산 반영</label><select id="dBudget"><option value="both">주간·월간</option><option value="month">월간만</option><option value="none">반영 안 함</option></select></div></div><div class="form-actions"><button class="ghost" onclick="closeModal()">취소</button><button class="primary" onclick="saveDebt()">저장</button></div></div></div>`}
window.saveDebt=function(){
 const name=document.getElementById("dName").value.trim();

 const rate=Number(document.getElementById("dRate").value)||0;
 const pay=parseMoney(document.getElementById("dPay").value);
 const day=Math.max(1,Math.min(31,Number(document.getElementById("dDay").value)||1));
 const b=document.getElementById("dBudget").value;
 if(!name||!principal||!pay)return alert("대출명, 현재 원금, 월 납입액을 입력하세요.");
 state.debts.push({id:Date.now(),name,principal,rate,paymentDay:day,monthlyPayment:pay,weekly:b==="both",monthly:b!=="none"});
 notify("강신나","부채 등록",`${name} · 현재 원금 ${won(principal)} · 월 납입 ${won(pay)}`);

window.closeModal=function(){document.getElementById("modalRoot").innerHTML=""}
window.openBalance=function(team){document.getElementById("modalRoot").innerHTML=`<div class="modal-back"><div class="modal"><h3>${team} 계좌 잔액 맞추기</h3><p>실제 통장과 시스템 숫자가 다를 때만 사용합니다. 매출·지출·자금이동은 평소 자동 반영됩니다.</p><div class="field"><label>실제 현재 잔액</label><input id="balVal" inputmode="numeric" value="${state.accounts[team]}"></div><div class="field" style="margin-top:10px"><label>조정 사유</label><input id="balMemo" placeholder="예: 누락 거래 반영"></div><div class="form-actions"><button class="ghost" onclick="closeModal()">취소</button><button class="primary" onclick="saveBalance('${team}')">저장</button></div></div></div>`}
window.saveBalance=function(team){const before=state.accounts[team],v=parseMoney(document.getElementById("balVal").value),memo=document.getElementById("balMemo").value||"잔액 조정";state.accounts[team]=v;notify("강신나",`${team} 잔액 조정`,`${won(before)} → ${won(v)} · ${memo}`);if(team!=="강신나")notify(team,"계좌잔액 조정",`현재 계좌잔액이 ${won(v)}으로 수정되었습니다.`);saveState();closeModal();showToast("계좌잔액이 수정되었습니다.",`${team} · ${won(v)}`);renderApp()}

 if(document.getElementById("planType")) toggleRecurringOption();
 bindCalendarLongPress();
}

(async function init(){

   const session=await fetch('/api/session',{cache:'no-store'});
   const info=await session.json();
   if(info.authenticated){
     await loadRemoteState();
     selectedWeekStart=weekStartISO(sessionStorage.getItem("selectedWeekStart")||todayISO());sessionStorage.setItem("selectedWeekStart",selectedWeekStart);syncBudgetMirror();
     const saved=sessionStorage.getItem("currentTeam");
     if(saved){currentTeam=saved;teamStyle(currentTeam);showOnly("mainScreen");renderApp()}else showOnly("teamScreen");
   }else showOnly("passwordScreen");
 }catch(e){showOnly("passwordScreen");document.getElementById("pwErr").textContent="서버 연결을 확인하세요.";}
 setInterval(syncRemoteState,5000);
})();
</script>
